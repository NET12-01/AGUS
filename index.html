<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="AGUS, asistente personal estilo JARVIS con comandos rápidos, voz masculina, matemática avanzada e IA conectable.">
<title>AGUS · Asistente personal</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050b13;
  --panel:rgba(8,20,34,.82);
  --cyan:#48e4ff;
  --glow:rgba(72,228,255,.55);
  --glow-soft:rgba(72,228,255,.15);
  --border:rgba(72,228,255,.22);
  --text:#e4f7ff;
  --muted:#83a4b8;
  --green:#56f0b0;
  --orange:#ffbd70;
  --radius:18px;
  --shadow:0 20px 70px rgba(0,0,0,.28);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overscroll-behavior:none}
body{
  overflow:hidden;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 50% -15%,#113850 0,#071521 42%,var(--bg) 78%);
  -webkit-font-smoothing:antialiased;position:fixed;inset:0;
  transition:background .6s ease;
}
button,input,select{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#background{position:fixed;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.vignette,.scanlines{position:fixed;inset:0;pointer-events:none}
.vignette{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}
.scanlines{opacity:.16;background:repeating-linear-gradient(to bottom,rgba(72,228,255,.06) 0 1px,transparent 1px 4px)}
.app{position:relative;z-index:1;height:100dvh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding-left:var(--safe-left);padding-right:var(--safe-right)}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + var(--safe-top)) clamp(12px,3vw,30px) 12px;min-width:0;
  border-bottom:1px solid var(--border);background:rgba(4,12,22,.72);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:border-color .4s ease;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{position:relative;flex:0 0 auto;width:38px;aspect-ratio:1;border:2px solid var(--cyan);border-radius:50%;box-shadow:0 0 22px var(--glow-soft),inset 0 0 15px var(--glow-soft);transition:border-color .4s ease,box-shadow .4s ease}
.logo::after{content:"";position:absolute;inset:9px;border-radius:inherit;background:var(--cyan);box-shadow:0 0 15px var(--cyan);animation:pulse 2.2s ease-in-out infinite;transition:background .4s ease}
h1{margin:0;color:#fff;font-size:18px;line-height:1.1;letter-spacing:.28em;font-weight:750;text-shadow:0 0 18px var(--glow)}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.header-right{display:flex;align-items:center;justify-content:flex-end;gap:clamp(6px,1.5vw,14px)}
.clock{font-variant-numeric:tabular-nums;color:#fff;font-size:clamp(14px,1.8vw,20px);letter-spacing:.06em;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:.14em;white-space:nowrap;transition:color .4s ease}
.dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--orange);box-shadow:0 0 12px currentColor}
.status.online .dot{background:var(--green)}
.mini-btn,.chip,.mic,.send{
  color:var(--text);border:1px solid var(--border);background:var(--glow-soft);
  transition:background .18s ease,border-color .18s ease,transform .12s ease,color .4s ease;
}
.mini-btn:hover,.chip:hover,.mic:hover,.send:hover{background:var(--glow-soft);border-color:var(--cyan)}
.mini-btn:active,.chip:active,.mic:active,.send:active{transform:scale(.96)}
.mini-btn{min-height:34px;padding:6px 10px;border-radius:9px;font-size:11.5px;white-space:nowrap;font-weight:600}
main{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,1.4fr);gap:clamp(12px,2vw,24px);padding:clamp(12px,2.4vw,26px);min-height:0;overflow:hidden}
.core-panel{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(155deg,rgba(9,32,48,.45),rgba(3,10,18,.22));padding:16px;transition:border-color .4s ease}
.reactor{position:relative;width:clamp(140px,18vw,220px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;border:1px solid var(--border);border-radius:50%;transition:border-color .4s ease}
.r1{border-top-color:var(--cyan);border-bottom-color:var(--cyan);animation:spin 12s linear infinite;box-shadow:0 0 24px -12px var(--cyan)}
.r2{inset:12%;border-left-color:var(--cyan);border-right-color:var(--cyan);animation:spin 8s linear infinite reverse}
.r3{inset:25%;border-top-color:var(--cyan);animation:spin 5s linear infinite}
.ticks{position:absolute;inset:-7%;border-radius:50%;opacity:.36;background:repeating-conic-gradient(var(--cyan) 0deg 1deg,transparent 1deg 8deg);-webkit-mask:radial-gradient(circle,transparent 65%,#000 66%);mask:radial-gradient(circle,transparent 65%,#000 66%);animation:spin 36s linear infinite}
.core{width:39%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--cyan) 22%,var(--cyan) 47%,rgba(0,0,0,.7) 75%,transparent 100%);box-shadow:0 0 42px var(--glow),0 0 100px var(--glow-soft),inset 0 0 25px white;animation:pulse 3s ease-in-out infinite;transition:background .4s ease,box-shadow .4s ease}
body.speaking .core{background:radial-gradient(circle,#fff 0,#ffe2be 22%,var(--orange) 48%,#684016 75%,transparent 100%)}
body.listening .core{background:radial-gradient(circle,#fff 0,#c8ffe8 22%,var(--green) 48%,#07523e 75%,transparent 100%)}
.wave{height:32px;display:flex;align-items:center;justify-content:center;gap:5px}
.wave span{width:3px;height:5px;border-radius:8px;background:var(--cyan);opacity:.42;transition:background .4s ease}
body.speaking .wave span{animation:wave .75s ease-in-out infinite;background:var(--orange);opacity:1}
body.speaking .wave span:nth-child(3n){animation-delay:.18s}
body.speaking .wave span:nth-child(2n){animation-delay:.32s}
.eyebrow{color:var(--muted);text-transform:uppercase;font-size:9.5px;letter-spacing:.2em;text-align:center}
.core-label{margin:6px 0 0;color:#fff;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.16em}
.core-help{max-width:260px;margin:6px 12px 0;color:var(--muted);font-size:11.5px;line-height:1.55;text-align:center}
.voice-row{display:flex;align-items:center;gap:7px;max-width:100%;color:var(--muted);font-size:11px}
.voice-row label{white-space:nowrap}
.voice-select{min-width:0;width:180px;max-width:60vw;padding:7px 8px;border:1px solid var(--border);border-radius:9px;color:var(--text);background:#091725;font-size:11px}
.chat-panel{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow),inset 0 0 60px var(--glow-soft);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .4s ease}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.chat-head h2{margin:0;color:#fff;font-size:13.5px;font-weight:650}
.mode-pill{color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 9px;font-size:10px;white-space:nowrap}
.messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:stretch;gap:11px;padding:clamp(12px,1.8vw,20px);overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:var(--glow-soft);border-radius:10px}
.msg{max-width:88%;padding:10px 14px;border:1px solid var(--border);border-left:2px solid var(--cyan);border-radius:4px 14px 14px 14px;align-self:flex-start;color:#dff7ff;background:var(--glow-soft);font-size:14px;line-height:1.62;overflow-wrap:anywhere;white-space:pre-wrap;animation:message-in .22s ease both;transition:border-color .4s ease}
.msg.user{align-self:flex-end;border:1px solid var(--border);border-radius:14px 4px 14px 14px;background:var(--glow-soft);color:#fff}
.msg.system,.msg.action{align-self:center;max-width:96%;border:1px solid rgba(255,189,112,.24);border-radius:999px;padding:7px 12px;background:rgba(255,189,112,.07);color:#ffd9ae;font-size:11px;text-align:center}
.msg.action{border-color:var(--border);background:var(--glow-soft);color:#d6f8ff}
.who{display:block;margin:0 0 4px;color:var(--cyan);font-size:9px;letter-spacing:.18em;font-weight:750;text-transform:uppercase;transition:color .4s ease}
.user .who{color:var(--cyan)}
.msg a{color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
.sources{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:8px;border-top:1px solid var(--border);font-size:11px}
.sources-title{color:var(--muted);font-weight:700}
.typing{display:flex;align-items:center;gap:5px;min-width:65px;padding:13px 15px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
.chips{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 11px;border-radius:999px;color:#cfeef8;font-size:10.5px;white-space:nowrap}
.input-bar{display:flex;gap:8px;align-items:center;padding:11px 12px max(11px,var(--safe-bottom));border-top:1px solid var(--border);background:rgba(3,10,18,.72)}
.input-bar input{flex:1;width:0;min-width:0;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px 13px;background:rgba(0,0,0,.24);color:#effbff;outline:none;font-size:16px}
.input-bar input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--glow-soft)}
.input-bar input::placeholder{color:#7392a4}
.mic,.send{flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;border-radius:11px;font-size:17px}
.mic.listening{border-color:var(--green);background:var(--green);color:#04251a;box-shadow:0 0 18px rgba(86,240,176,.35);animation:pulse 1s infinite}
.send{color:#04141c;border-color:var(--cyan);background:var(--cyan);font-weight:800}
.footnote{padding:0 12px 8px;color:#6d8da0;background:rgba(3,10,18,.72);font-size:9.5px;text-align:center}
.boot{position:fixed;z-index:10;inset:0;display:grid;place-content:center;justify-items:center;gap:15px;background:#040a12;transition:opacity .5s ease,visibility .5s ease}
.boot.hidden{visibility:hidden;opacity:0;pointer-events:none}
.boot-orb{width:78px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--cyan) 25%,var(--cyan) 52%,transparent 78%);box-shadow:0 0 75px var(--glow-soft);animation:pulse 1.2s ease-in-out infinite;transition:background .4s ease}
.boot-name{color:#fff;letter-spacing:.4em;font-size:22px;font-weight:750}
.boot-caption{color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase;text-align:center;padding:0 20px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.76;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes wave{0%,100%{height:5px}50%{height:26px}}
@keyframes message-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px}
  .core-panel{min-height:0;flex-direction:row;justify-content:flex-start;gap:12px;padding:9px 12px;background:rgba(9,32,48,.3)}
  .reactor{width:72px;flex:0 0 72px}
  .ticks{inset:-5%}
  .wave{display:none}
  .core-meta{min-width:0;text-align:left;flex:1}
  .eyebrow,.core-label{text-align:left}
  .core-label{margin-top:4px;font-size:11px;letter-spacing:.12em}
  .core-help{max-width:480px;margin:4px 0 0;text-align:left;font-size:10.5px;line-height:1.35}
  .voice-row{margin-left:auto;flex:0 1 auto}
  .voice-row label{display:none}
  .voice-select{width:130px;max-width:30vw}
}
@media (max-width:560px){
  header{padding:calc(9px + var(--safe-top)) 10px 9px;gap:6px}
  .logo{width:30px}
  .logo::after{inset:7px}
  .brand{gap:8px}
  h1{font-size:15px;letter-spacing:.18em}
  .subtitle{display:none}
  .header-right{gap:6px}
  .clock{display:none}
  .status{font-size:9px;letter-spacing:.06em}
  .mini-btn{min-height:31px;padding:5px 7px;font-size:10.5px}
  main{gap:8px;padding:8px}
  .core-panel{padding:6px 8px;gap:8px;border-radius:12px}
  .reactor{width:52px;flex-basis:52px}
  .r2{inset:13%}
  .r3{inset:26%}
  .eyebrow{font-size:8px;letter-spacing:.1em}
  .core-label{font-size:9.5px;letter-spacing:.06em}
  .core-help{display:none}
  .voice-select{width:108px;max-width:29vw;padding:6px 4px;font-size:9.5px}
  .chat-panel{border-radius:13px}
  .chat-head{padding:10px 12px}
  .chat-head h2{font-size:12.5px}
  .mode-pill{font-size:9px;padding:3px 8px}
  .messages{gap:9px;padding:11px}
  .msg{max-width:93%;padding:9px 11px;font-size:13px;line-height:1.55}
  .chips{padding:0 8px 8px;gap:5px}
  .chip{padding:6px 9px;font-size:10px}
  .input-bar{gap:6px;padding:8px 8px max(8px,var(--safe-bottom))}
  .mic,.send{width:42px;height:42px;border-radius:10px;font-size:16px}
  .input-bar input{min-height:42px;padding:9px 11px;font-size:16px}
  .footnote{padding-bottom:6px;font-size:9px}
  .boot-orb{width:68px}
  .boot-name{font-size:18px;letter-spacing:.3em}
}
@media (max-width:380px){h1{font-size:13px;letter-spacing:.14em}.msg{font-size:12.5px}}
@media (orientation:landscape) and (max-height:520px){.core-panel{display:none}main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot-orb"></div>
  <div class="boot-name">AGUS</div>
  <div class="boot-caption">Inicializando sistemas…</div>
</div>
<canvas id="background" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>AGUS</h1>
        <p class="subtitle">Sistema de asistencia personal</p>
      </div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">INICIANDO</span></div>
      <button class="mini-btn" type="button" id="audioBtn" aria-pressed="true">🔊 Voz</button>
      <button class="mini-btn" type="button" id="clearBtn">Limpiar</button>
    </div>
  </header>

  <main>
    <section class="core-panel">
      <div class="reactor" aria-hidden="true">
        <div class="ticks"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div>
      </div>
      <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="core-meta">
        <div class="eyebrow">Núcleo</div>
        <p class="core-label" id="coreLabel">A SU SERVICIO</p>
        <p class="core-help" id="coreHelp">Comandos rápidos, matemática avanzada, voz masculina y conexión a IA.</p>
      </div>
      <div class="voice-row">
        <label for="voiceSelect">Voz:</label>
        <select class="voice-select" id="voiceSelect"><option value="">Buscando voces…</option></select>
      </div>
    </section>

    <section class="chat-panel">
      <div class="chat-head"><h2>Conversación</h2><span class="mode-pill" id="modeLabel">Comandos locales</span></div>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <div class="chips">
        <button class="chip" type="button" data-cmd="Abre YouTube">▶ YouTube</button>
        <button class="chip" type="button" data-cmd="Abre Google">⌕ Google</button>
        <button class="chip" type="button" data-cmd="Cambia el reactor a dorado">🎨 Dorado</button>
        <button class="chip" type="button" data-cmd="Cambia el reactor a rojo">🎨 Rojo</button>
        <button class="chip" type="button" data-cmd="Calcula 15% de 240">∑ Porcentaje</button>
        <button class="chip" type="button" data-cmd="Qué hora es">◷ Hora</button>
        <button class="chip" type="button" data-cmd="Ayuda">? Ayuda</button>
      </div>
      <form class="input-bar" id="chatForm" autocomplete="off">
        <button class="mic" id="micBtn" type="button" title="Dictar">🎙</button>
        <input id="userInput" type="text" maxlength="10000" placeholder="A su servicio. Dígame qué necesita…" autocomplete="off">
        <button class="send" type="submit" title="Enviar">➤</button>
      </form>
      <div class="footnote">Enter para enviar · El micrófono escucha solo cuando lo activás</div>
    </section>
  </main>
</div>

<script>
'use strict';

/* ==================== REFERENCIAS ==================== */
const $ = s => document.querySelector(s);
const body = document.body;
const messagesEl = $('#messages');
const userInput = $('#userInput');
const chatForm = $('#chatForm');
const micBtn = $('#micBtn');
const audioBtn = $('#audioBtn');
const statusEl = $('#status');
const statusText = $('#statusText');
const coreLabel = $('#coreLabel');
const coreHelp = $('#coreHelp');
const modeLabel = $('#modeLabel');
const voiceSelect = $('#voiceSelect');

/* ==================== ESTADO ==================== */
const STATE = {
  assistantName: 'AGUS',
  nombre: 'José',
  apelativo: 'Señor',
  colorReactor: 'cyan',
  voiceEnabled: true,
  aiAvailable: false,
  modelName: '',
  maxHistory: 14,
  timers: new Map(),
  speech: window.speechSynthesis || null,
  selectedVoice: null,
  conversation: []
};
try {
  const n = localStorage.getItem('agus_nombre');
  if (n && n.trim()) STATE.nombre = n.trim().slice(0,40);
  const a = localStorage.getItem('agus_apelativo');
  if (a !== null) STATE.apelativo = a;
  const c = localStorage.getItem('agus_color');
  if (c && c.trim()) STATE.colorReactor = c.trim();
  STATE.voiceEnabled = localStorage.getItem('agus_voice_enabled') !== 'false';
} catch(_){}

function guardar(){
  try {
    localStorage.setItem('agus_nombre', STATE.nombre);
    localStorage.setItem('agus_apelativo', STATE.apelativo);
    localStorage.setItem('agus_color', STATE.colorReactor);
  } catch(_){}
}

/* ==================== COLORES ==================== */
const COLORES = {
  cyan:{hex:'#48e4ff',glow:'rgba(72,228,255,.55)',soft:'rgba(72,228,255,.15)',border:'rgba(72,228,255,.22)',nombre:'cyan',aliases:['cyan','celeste','turquesa','azul claro','original','defecto']},
  rojo:{hex:'#ff4d5e',glow:'rgba(255,77,94,.55)',soft:'rgba(255,77,94,.15)',border:'rgba(255,77,94,.22)',nombre:'rojo',aliases:['rojo','red','escarlata']},
  verde:{hex:'#56f0b0',glow:'rgba(86,240,176,.55)',soft:'rgba(86,240,176,.15)',border:'rgba(86,240,176,.22)',nombre:'verde',aliases:['verde','green','esmeralda']},
  dorado:{hex:'#ffb84d',glow:'rgba(255,184,77,.55)',soft:'rgba(255,184,77,.15)',border:'rgba(255,184,77,.22)',nombre:'dorado',aliases:['dorado','gold','oro','amarillo']},
  morado:{hex:'#b78bff',glow:'rgba(183,139,255,.55)',soft:'rgba(183,139,255,.15)',border:'rgba(183,139,255,.22)',nombre:'morado',aliases:['morado','purple','violeta','lila']},
  rosa:{hex:'#ff7ec8',glow:'rgba(255,126,200,.55)',soft:'rgba(255,126,200,.15)',border:'rgba(255,126,200,.22)',nombre:'rosa',aliases:['rosa','pink','fucsia']},

function aplicarColor(clave){
  const c = COLORES[clave] || COLORES.cyan;
  const r = document.documentElement.style;
  r.setProperty('--cyan', c.hex);
  r.setProperty('--glow', c.glow);
  r.setProperty('--glow-soft', c.soft);
  r.setProperty('--border', c.border);
  body.style.background = 'radial-gradient(ellipse at 50% -15%, ' + hexToRgba(c.hex,.12) + ' 0, #071521 42%, #050b13 78%)';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', c.hex);
  STATE.colorReactor = clave;
  guardar();
}
function hexToRgba(hex,alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function detectarColor(texto){
  const t = norm(texto);
  for (const clave in COLORES){
    for (const alias of COLORES[clave].aliases){
      if (new RegExp('\\b'+alias+'\\b').test(t)) return clave;
    }
  }
  return null;
}

const FEM = /(female|woman|mujer|femenina|helena|paulina|sabina|elvira|estrella|ximena|monica|mónica|lucia|lucía|maria|maría|carmen|laura|sofia|sofía|isabel|esperanza|dalia|valentina|jessica|jennifer|kate|samantha|zira|cortana|victoria|karen|susan|allison|ava|emma|mia|elena|natalia|claudia|camila|andrea|lola|lorena|patricia|silvia|rosa|marta|ana|cristina|beatriz|nuria|pilar|raquel)/i;
const MAS = /(tristan|trístan|arnau|dario|darío|elias|elías|saul|saúl|teo|alvaro|álvaro|jorge|pablo|raul|raúl|diego|carlos|david|daniel|miguel|luis|sergio|antonio|juan|andres|andrés|enrique|hector|héctor|bruno|nicolas|nicolás|tomas|tomás|davefx|carlfm|male|masculino|hombre)/i;
function esFem(v){ return FEM.test(v?.name || ''); }
function esMasc(v){ return MAS.test(v?.name || ''); }

function cargarVoces(){
  if (!STATE.speech) return;
  const voces = STATE.speech.getVoices() || [];
  if (!voces.length) return;
  const es = voces.filter(v => /^es([-_]|$)/i.test(v.lang));
  let cand = es.filter(v => esMasc(v) && !esFem(v));
  if (!cand.length) cand = es.filter(v => !esFem(v));
  if (!cand.length) cand = voces.filter(v => esMasc(v) && !esFem(v));
  if (!cand.length) cand = es.length ? es : voces;
  let ult = '';
  try { ult = localStorage.getItem('agus_voice_uri') || ''; } catch(_){}
  voiceSelect.replaceChildren();
  const auto = document.createElement('option');
  auto.value = '';
  auto.textContent = cand.some(esMasc) ? 'Automática (masculina)' : 'Automática (más grave)';
  voiceSelect.appendChild(auto);
  cand.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' · ' + v.lang;
    voiceSelect.appendChild(o);
  });
  STATE.selectedVoice = cand.find(v => v.voiceURI === ult) || cand[0] || null;
  voiceSelect.value = STATE.selectedVoice && ult === STATE.selectedVoice.voiceURI ? ult : '';
}
if (STATE.speech){
  cargarVoces();
  if (typeof STATE.speech.addEventListener === 'function') STATE.speech.addEventListener('voiceschanged', cargarVoces);
  STATE.speech.onvoiceschanged = cargarVoces;
  setTimeout(cargarVoces, 300);
  setTimeout(cargarVoces, 1200);
  setTimeout(cargarVoces, 3000);
} else {
  voiceSelect.replaceChildren(new Option('Voz no disponible',''));
}
voiceSelect.addEventListener('change', () => {
  const voces = STATE.speech ? STATE.speech.getVoices() : [];
  const v = voces.find(x => x.voiceURI === voiceSelect.value);
  if (v && !esFem(v)) {
    STATE.selectedVoice = v;
    try { localStorage.setItem('agus_voice_uri', voiceSelect.value); } catch(_){}
  } else if (v) {
    addMessage('Esa voz no se identificó como masculina. Elegí otra.', 'system');
  }
});

function hablar(texto){
  if (!STATE.voiceEnabled || !STATE.speech || !STATE.selectedVoice) return;
  try {
    STATE.speech.cancel();
    const limpio = String(texto)
      .replace(/https?:\/\/\S+/g,'enlace web')
      .replace(/[`*_#>|]/g,'')
      .replace(/\n+/g,'. ')
      .slice(0, 2400);
    const u = new SpeechSynthesisUtterance(limpio);
    u.voice = STATE.selectedVoice;
    u.lang = STATE.selectedVoice.lang || 'es-AR';
    u.rate = 0.98;
    u.pitch = 0.7;
    u.volume = 1;
    u.onstart = () => { body.classList.add('speaking'); setStatus('HABLANDO', STATE.aiAvailable); };
    u.onend = u.onerror = () => {
      body.classList.remove('speaking');
      setStatus(STATE.aiAvailable ? 'IA EN LÍNEA' : 'A SU SERVICIO', STATE.aiAvailable);
    };
    STATE.speech.speak(u);
  } catch(_) { body.classList.remove('speaking'); }
}

function scrollBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }
function addMessage(txt, rol='bot', fuentes=[]){
  const div = document.createElement('div');
  div.className = 'msg ' + rol;
  if (rol === 'bot' || rol === 'user'){
    const w = document.createElement('span');
    w.className = 'who';
    w.textContent = rol === 'user' ? STATE.nombre : STATE.assistantName;
    div.appendChild(w);
  }
  div.appendChild(document.createTextNode(String(txt ?? '')));
  if (rol === 'bot' && Array.isArray(fuentes) && fuentes.length){
    const box = document.createElement('div');
    box.className = 'sources';
    const t = document.createElement('span');
    t.className = 'sources-title';
    t.textContent = 'Fuentes consultadas';
    box.appendChild(t);
    fuentes.slice(0,8).forEach(f => {
      if (!f || typeof f.url !== 'string') return;
      try {
        const u = new URL(f.url);
        if (!['http:','https:'].includes(u.protocol)) return;
        const a = document.createElement('a');
        a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = (f.title || u.hostname).slice(0,160);
        box.appendChild(a);
      } catch(_){}
    });
    if (box.children.length > 1) div.appendChild(box);
  }
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}
function addAction(txt,url){
  const div = document.createElement('div');

  div.appendChild(document.createTextNode(txt + ' '));
  const a = document.createElement('a');

/* ==================== ABRIR URL Y BÚSQUEDAS ==================== */
function abrirUrl(url,label){
  let v;
  try { v = new URL(url); } catch(_) { return false; }
  if (!['https:','http:'].includes(v.protocol)) return false;
  let win = null;
  try { win = window.open(v.href,'_blank'); if (win) win.opener = null; } catch(_) { win = null; }
  addAction(win ? 'Abriendo ' + label + '.' : 'El navegador bloqueó ' + label + '. Enlace manual:', v.href);
  return true;
}
function buscarEn(q,donde){
  q = String(q||'').trim();
  if (!q) return false;
  const url = donde === 'youtube'
    ? 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q)
    : 'https://www.google.com/search?q=' + encodeURIComponent(q);
  return abrirUrl(url, donde === 'youtube' ? 'la búsqueda de YouTube' : 'la búsqueda de Google');
}
function detectarSitio(destino){
  let valor = norm(destino).replace(/\b(ahora|rapido|rapidamente|por favor|ya mismo|ya)\b/g,'').trim();
  valor = valor.replace(/^(la pagina de |pagina de |el sitio de |sitio de |la web de |web de |la app de |app de )/, '').trim();
  for (const e of SITIOS_FLAT){
    const c = norm(e.k);
    if (valor === c || valor === 'www ' + c || valor.startsWith(c + ' ')) return e.sitio;
  }
  const host = String(destino||'').trim().replace(/[.,!?]+$/,'');
  if (/^https?:\/\//i.test(host)){
    try {
      const u = new URL(host);
      if (u.hostname.includes('.') && !u.username && !u.password) return {u:u.href,l:u.hostname};
    } catch(_){}
  }
  if (/^(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?$/i.test(host)){
    try {
      const u = new URL('https://' + host.replace(/^https?:\/\//i,''));
      if (!u.username && !u.password) return {u:u.href,l:u.hostname};
    } catch(_){}
  }
  return null;
}

/* ==================== MOTOR MATEMÁTICO ==================== */
const MathEngine = (() => {
  const PI = Math.PI, E = Math.E;
  function limpiar(s){
    s = String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    s = s.replace(/^(?:por favor\s+)?(?:calcula(?:me)?|cuanto es|cuanto da|cuanto vale|resuelve|resultado de|evalua|opera)\s+/i,'');
    s = s.replace(/[×✕]/g,'*').replace(/[÷]/g,'/').replace(/\^\^/g,'^').replace(/\*\*/g,'^');
    s = s.replace(/raiz cuadrada de\s*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*\)?/g,'sqrt($1)');
    s = s.replace(/raiz cubica de\s*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*\)?/g,'cbrt($1)');
    s = s.replace(/raiz de\s*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*\)?/g,'sqrt($1)');
    s = s.replace(/([0-9]+(?:\.[0-9]+)?)\s+al cuadrado/g,'($1)^2');
    s = s.replace(/([0-9]+(?:\.[0-9]+)?)\s+al cubo/g,'($1)^3');
    s = s.replace(/\belevado a\b/g,'^').replace(/\bdividido (?:por|entre)\b/g,'/').replace(/\bentre\b/g,'/').replace(/\bmultiplicado por\b/g,'*').replace(/\bpor\b/g,'*').replace(/\bmas\b/g,'+').replace(/\bmenos\b/g,'-');
    s = s.replace(/,\s*/g,'.').replace(/\s+/g,'');
    return s;
  }
  function evaluar(expr){
    try {
      const s = limpiar(expr);
      if (!s) return null;
      const tokens = s.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[a-z]+|[()+\-*/%^!]/g);
      if (!tokens || !tokens.length) return null;
      if (tokens.join('') !== s) return null;
      const funcs = {sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,sin:Math.sin,sen:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,log:Math.log10,log10:Math.log10,ln:Math.log,log2:Math.log2,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round};
      function fact(n){
        if (!Number.isInteger(n) || n < 0 || n > 170) throw new Error('factorial');
        let r = 1;
        for (let i=2;i<=n;i++) r *= i;
        return r;
      }
      let i = 0;
      const peek = () => tokens[i];
      const take = () => tokens[i++];
      function primary(){
        const t = take();
        if (t === undefined) throw new Error('incompleto');
        if (t === '('){ const v = expression(); if (take() !== ')') throw new Error('parentesis'); return v; }
        if (/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/.test(t)) return parseFloat(t);
        if (t === 'pi') return PI;
        if (t === 'e') return E;
        if (Object.prototype.hasOwnProperty.call(funcs,t)){
          let arg;
          if (peek() === '('){ take(); arg = expression(); if (take() !== ')') throw new Error('parentesis'); }
          else arg = unary();
          return funcs[t](arg);
        }
        throw new Error('token ' + t);
      }
      function postfix(){ let v = primary(); while (peek() === '!'){ take(); v = fact(v); } return v; }
      function power(){ const b = postfix(); if (peek() === '^'){ take(); return b ** unary(); } return b; }
      function unary(){ if (peek() === '+'){ take(); return unary(); } if (peek() === '-'){ take(); return -unary(); } return power(); }
      function term(){
        let v = unary();
        while (['*','/','%'].includes(peek())){
          const op = take(); const r = unary();
          if ((op === '/' || op === '%') && r === 0) throw new Error('div0');
          if (op === '*') v *= r;
          if (op === '/') v /= r;
          if (op === '%') v %= r;
        }
        return v;
      }
      function expression(){
        let v = term();
        while (peek() === '+' || peek() === '-'){
          const op = take(); const r = term();
          v = op === '+' ? v + r : v - r;
        }
        return v;
      }
      const r = expression();
      if (i !== tokens.length || !Number.isFinite(r)) return null;
      return Math.abs(r) < 1e-12 ? 0 : Number(r.toPrecision(12));
    } catch(_){ return null; }
  }
  function esPrimo(n){
    n = Math.floor(n);
    if (n < 2) return false;
    if (n < 4) return true;
    if (n % 2 === 0) return false;
    const lim = Math.floor(Math.sqrt(n));
    for (let i=3;i<=lim;i+=2) if (n % i === 0) return false;
    return true;
  }
  function factores(n){
    n = Math.floor(n);
    if (n < 2) return [];
    const r = []; let d = 2;
    while (n > 1){
      while (n % d === 0){ r.push(d); n /= d; }
      d++;
      if (d*d > n && n > 1){ r.push(n); break; }
    }
    return r;
  }
  function fib(n){
    n = Math.floor(n);
    if (n < 0 || n > 100) return null;
    if (n === 0) return 0;
    if (n === 1) return 1;
    let a = 0, b = 1, c;
    for (let i=2;i<=n;i++){ c = a+b; a = b; b = c; }
    return b;
  }
  function mcd(a,b){ a = Math.abs(Math.floor(a)); b = Math.abs(Math.floor(b)); while (b){ const t = b; b = a%b; a = t; } return a; }
  function mcm(a,b){ a = Math.abs(Math.floor(a)); b = Math.abs(Math.floor(b)); if (!a || !b) return 0; return (a*b)/mcd(a,b); }
  function est(nums){
    const n = nums.length;
    if (!n) return null;
    const suma = nums.reduce((a,b)=>a+b,0);
    const media = suma/n;
    const ord = nums.slice().sort((a,b)=>a-b);
    const mediana = n%2 ? ord[(n-1)/2] : (ord[n/2-1]+ord[n/2])/2;
    const cnt = {};
    ord.forEach(v => cnt[v] = (cnt[v]||0)+1);
    let moda = [], max = 0;
    for (const k in cnt){
      if (cnt[k] > max){ max = cnt[k]; moda = [parseFloat(k)]; }
      else if (cnt[k] === max) moda.push(parseFloat(k));
    }
    const varz = nums.reduce((a,b)=>a+Math.pow(b-media,2),0)/n;
    return {suma,media,mediana,moda,varianza:varz,desv:Math.sqrt(varz),min:ord[0],max:ord[n-1]};
  }
  function cuad(a,b,c){
    const disc = b*b - 4*a*c;
    if (disc < 0){
      const re = -b/(2*a), im = Math.sqrt(-disc)/(2*a);
      return {tipo:'complejas',x1:re+' + '+im.toFixed(4)+'i',x2:re+' - '+im.toFixed(4)+'i'};
    }
    if (disc === 0) return {tipo:'doble',x1:-b/(2*a)};
    return {tipo:'reales',x1:(-b+Math.sqrt(disc))/(2*a),x2:(-b-Math.sqrt(disc))/(2*a)};
  }
  return {evaluar,esPrimo,factores,fib,mcd,mcm,est,cuad};
})();

    const COMUNES = /^(algo|una|un|la|el|los|las|que|qu[eé]|como|c[oó]mo|donde|d[oó]nde|cuando|cu[aá]ndo|por|para|si|no|tu|mi|su|otra|otro|esta|este|esa|ese|mas|m[aá]s|hola|chau|adios|todo|nada)$/i;
    if (!COMUNES.test(palabra)){
      STATE.nombre = palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();
      STATE.apelativo = STATE.nombre;
      guardar();
      return 'Entendido, ' + STATE.nombre + '. A partir de ahora me dirigiré a usted así.';
    }
  }
  if (/(?:vuelve\s+a\s+decirme|dime|ll[aá]mame|tr[aá]tame\s+de)\s+se[ñn]or/.test(t)){
    STATE.apelativo = 'Señor'; guardar();
    return 'Como usted diga, Señor.';
  }
  if (/(sin\s+t[ií]tulos?|no\s+uses?\s+t[ií]tulos?|no\s+me\s+pongas?\s+t[ií]tulos?|no\s+me\s+digas\s+nada|sin\s+formalidades)/.test(t)){
    STATE.apelativo = ''; guardar();

  if (/(c[oó]mo\s+me\s+llamas|c[oó]mo\s+me\s+llamo|cu[aá]l\s+es\s+mi\s+nombre|c[oó]mo\s+me\s+dices)/.test(t)){

/* ==================== TIMERS ==================== */
function startTimer(n,u){
  n = Number(n);
  if (!isFinite(n) || n <= 0) return 'El tiempo debe ser mayor que cero.';
  let ms = n * 1000;
  if (u.startsWith('min')) ms = n * 60000;
  if (u.startsWith('hora')) ms = n * 3600000;
  if (ms > 7*24*3600000) return 'El temporizador admite hasta 7 días.';
  const id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
  const timer = setTimeout(() => {
    STATE.timers.delete(id);
    addMessage('⏰ ' + STATE.nombre + apeFin() + ', terminó el temporizador de ' + n + ' ' + u + '.', 'system');
    hablar('Atención. Terminó el temporizador de ' + n + ' ' + u + '.');
  }, ms);
  STATE.timers.set(id,timer);
  return fraseJarvis() + ' Temporizador activado por ' + n + ' ' + u + '. Le avisaré cuando termine.';
}
function clearTimers(){
  for (const t of STATE.timers.values()) clearTimeout(t);
  STATE.timers.clear();
}
function countdown(sec){
  if (!Number.isSafeInteger(sec) || sec < 1 || sec > 86400) return 'La cuenta atrás admite entre 1 segundo y 24 horas.';
  let rest = sec;
  addMessage('Cuenta atrás iniciada: ' + sec + ' segundos.', 'system');
  const id = setInterval(() => {
    rest -= 1;
    if (rest <= 0){
      clearInterval(id);
      STATE.timers.delete(id);
      addMessage('⏰ ¡Cuenta atrás terminada!', 'system');
      hablar('La cuenta atrás terminó.');
    }
  }, 1000);
  STATE.timers.set(id,id);
  return fraseJarvis() + ' Cuenta atrás iniciada desde ' + sec + ' segundos.';
}

/* ==================== MATEMÁTICA ==================== */
function procesarMatematica(texto){
  const t = norm(texto);
  let m;
  m = t.match(/(?:es\s+primo|numero\s+primo|verifica\s+si\s+es\s+primo)\s+(?:el\s+)?(?:numero\s+)?(\d+)/);
  if (m){ const n = parseInt(m[1],10); return MathEngine.esPrimo(n) ? 'Sí' + apeFin() + ', ' + n + ' es un número primo.' : 'No' + apeFin() + ', ' + n + ' no es primo.'; }
  m = t.match(/(?:factores\s+primos?\s+de|descompone\s+en\s+factores|factoriza)\s+(\d+)/);
  if (m){ const n = parseInt(m[1],10); const f = MathEngine.factores(n); if (f.length) return 'Los factores primos de ' + n + ' son: ' + f.join(' × ') + ' = ' + n + '.'; }
  m = t.match(/fibonacci\s+(?:de\s+|numero\s+)?(\d+)/);
  if (m){ const n = parseInt(m[1],10); const r = MathEngine.fib(n); if (r !== null) return 'El número de Fibonacci número ' + n + ' es ' + r + '.'; }
  m = t.match(/(?:factorial\s+de|el\s+factorial\s+de)\s+(\d+)/);
  if (m){ const n = parseInt(m[1],10); if (n > 170) return 'El número es demasiado grande.'; return 'El factorial de ' + n + ' es ' + MathEngine.evaluar(n + '!') + '.'; }
  m = t.match(/(?:mcd|maximo\s+comun\s+divisor)\s*(?:de)?\s*(\d+)\s*(?:y|,)\s*(\d+)/);
  if (m) return 'El MCD de ' + m[1] + ' y ' + m[2] + ' es ' + MathEngine.mcd(parseInt(m[1],10),parseInt(m[2],10)) + '.';
  m = t.match(/(?:mcm|minimo\s+comun\s+multiplo)\s*(?:de)?\s*(\d+)\s*(?:y|,)\s*(\d+)/);
  if (m) return 'El MCM de ' + m[1] + ' y ' + m[2] + ' es ' + MathEngine.mcm(parseInt(m[1],10),parseInt(m[2],10)) + '.';
  m = texto.match(/(-?\d*)\s*x\s*(?:\^?2)?\s*([+\-]\s*\d*)\s*x\s*([+\-]\s*\d+)?\s*=\s*0/i);
  if (m){
    const a = (m[1] === '' || m[1] === '+') ? 1 : (m[1] === '-' ? -1 : parseInt(m[1],10));
    const bStr = (m[2]||'').replace(/\s+/g,'');
    const cStr = (m[3]||'').replace(/\s+/g,'');
    const b = bStr === '+x' ? 1 : bStr === '-x' ? -1 : parseInt(bStr,10);
    const c = cStr ? parseInt(cStr,10) : 0;
    if (isFinite(a) && isFinite(b) && isFinite(c) && a !== 0){
      const r = MathEngine.cuad(a,b,c);
      if (r.tipo === 'reales') return 'Ecuación: ' + a + 'x² + ' + b + 'x + ' + c + ' = 0\nSoluciones: x₁ = ' + fmtNum(r.x1) + ', x₂ = ' + fmtNum(r.x2);
      if (r.tipo === 'doble') return 'Ecuación: ' + a + 'x² + ' + b + 'x + ' + c + ' = 0\nSolución doble: x = ' + fmtNum(r.x1);
      return 'Ecuación: ' + a + 'x² + ' + b + 'x + ' + c + ' = 0\nSoluciones complejas: x₁ = ' + r.x1 + ', x₂ = ' + r.x2;
    }
  }
  m = t.match(/(media|promedio|mediana|moda|desviacion\s+estandar|varianza|estadisticas?)\s+(?:de\s+)?([\d\s,.;]+)/);
  if (m){
    const nums = m[2].split(/[\s,;.]+/).map(parseFloat).filter(n => isFinite(n));
    if (nums.length >= 2){
      const e = MathEngine.est(nums);
      if (/media|promedio/.test(m[1])) return 'La media de [' + nums.join(', ') + '] es ' + fmtNum(e.media) + '.';
      if (/mediana/.test(m[1])) return 'La mediana es ' + fmtNum(e.mediana) + '.';
      if (/moda/.test(m[1])) return 'La moda es ' + e.moda.join(', ') + '.';
      if (/desviacion/.test(m[1])) return 'La desviación estándar es ' + fmtNum(e.desv) + '.';
      if (/varianza/.test(m[1])) return 'La varianza es ' + fmtNum(e.varianza) + '.';
      return 'Estadísticas de [' + nums.join(', ') + ']:\n• Suma: ' + e.suma + '\n• Media: ' + fmtNum(e.media) + '\n• Mediana: ' + fmtNum(e.mediana) + '\n• Moda: ' + e.moda.join(', ') + '\n• Mín: ' + e.min + '\n• Máx: ' + e.max + '\n• Desviación estándar: ' + fmtNum(e.desv);
    }
  }
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:%|por\s*ciento)\s*(?:de|del)\s*(\d+(?:[.,]\d+)?)/);
  if (m) return 'El ' + m[1] + '% de ' + m[2] + ' es ' + fmtNum(parseFloat(m[1].replace(',','.'))*parseFloat(m[2].replace(',','.'))/100) + '.';
  m = t.match(/que\s+porcentaje\s+es\s+(\d+(?:[.,]\d+)?)\s+de\s+(\d+(?:[.,]\d+)?)/);
  if (m){ const a = parseFloat(m[1].replace(',','.')); const b = parseFloat(m[2].replace(',','.')); if (b === 0) return 'No se puede dividir entre cero.'; return a + ' es el ' + fmtNum(a/b*100) + '% de ' + b + '.'; }
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:grados?\s+)?(celsius|centigrados?|°c)\s+a\s+(fahrenheit|°f)/);
  if (m) return m[1] + ' °C = ' + fmtNum(parseFloat(m[1].replace(',','.'))*9/5+32) + ' °F.';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:grados?\s+)?(fahrenheit|°f)\s+a\s+(celsius|centigrados?|°c)/);
  if (m) return m[1] + ' °F = ' + fmtNum((parseFloat(m[1].replace(',','.'))-32)*5/9) + ' °C.';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(km|kilometros?)\s+a\s+(millas?|mi)/);
  if (m) return m[1] + ' km = ' + fmtNum(parseFloat(m[1].replace(',','.'))*0.621371) + ' millas.';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(millas?|mi)\s+a\s+(km|kilometros?)/);
  if (m) return m[1] + ' millas = ' + fmtNum(parseFloat(m[1].replace(',','.'))*1.60934) + ' km.';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilogramos?)\s+a\s*(libras?|lb)/);
  if (m) return m[1] + ' kg = ' + fmtNum(parseFloat(m[1].replace(',','.'))*2.20462) + ' libras.';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(libras?|lb)\s+a\s*(kg|kilogramos?)/);
  if (m) return m[1] + ' libras = ' + fmtNum(parseFloat(m[1].replace(',','.'))*0.453592) + ' kg.';
  if (/^(?:calcula(?:me)?|cuanto es|cuanto da|cuanto vale|resuelve|resultado de|evalua|opera|raiz cuadrada de|raiz de)\b/.test(t)){
    const r = MathEngine.evaluar(texto);
    if (r !== null) return fraseJarvis() + ' El resultado es ' + fmtNum(r) + '.';
    return 'No pude interpretar esa operación. Probá con "calcula 24 * 7".';
  }
  if (/^[\d\s+\-*/%^().,!]+$/.test(texto.trim()) && /[+\-*/%^!]/.test(texto)){
    const r = MathEngine.evaluar(texto);
    if (r !== null) return 'El resultado es ' + fmtNum(r) + '.';
  }
  return null;
}

  if (/^(?:hola|buenas|buen dia|buenos dias|buenas tardes|buenas noches|hey|que tal|saludos)(?:\s|$)/.test(t)){

  let m = t.match(/(?:temporizador|alarma|aviso)\s+(?:de|por|en|para)\s+(\d+(?:[.,]\d+)?)\s*(segundos?|segs?|minutos?|mins?|horas?)/);
  if (m){ const u = /^seg/.test(m[2]) ? 'segundos' : /^min/.test(m[2]) ? 'minutos' : 'horas'; return {handled:true,reply:startTimer(Number(m[1].replace(',','.')),u)}; }

  if (m){

/* ==================== IA ==================== */
async function refreshHealth(){
  try {
    const r = await fetch('/api/health',{headers:{'Accept':'application/json'},cache:'no-store'});
    if (!r.ok) throw new Error('sin health');
    const d = await r.json();
    STATE.aiAvailable = Boolean(d.aiConfigured);
    STATE.modelName = String(d.model || '');
    modeLabel.textContent = STATE.aiAvailable ? 'IA conectada'+(STATE.modelName?' · '+STATE.modelName:'') : 'Comandos locales';
    setStatus(STATE.aiAvailable ? 'IA EN LÍNEA' : 'A SU SERVICIO', STATE.aiAvailable);
    coreHelp.textContent = STATE.aiAvailable
      ? 'IA conectada. Las preguntas de investigación pueden usar búsqueda web y mostrar fuentes.'
      : 'Comandos rápidos y cálculos activos. Conectá el servidor para IA avanzada.';
  } catch(_){
    STATE.aiAvailable = false;
    modeLabel.textContent = 'Comandos locales';
    setStatus('A SU SERVICIO', false);
    coreHelp.textContent = 'Modo de comandos locales. Iniciá el servidor Node.js para activar IA.';
  }
}

async function preguntarIA(txt){
  if (!STATE.aiAvailable) return null;
  const hist = STATE.conversation.slice(-STATE.maxHistory).map(i=>({role:i.role,content:i.content}));
  try {
    const r = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({message:txt,history:hist})
    });
    const d = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(d.error || ('Error '+r.status));
    if (!d.reply || typeof d.reply !== 'string') throw new Error('Respuesta vacía');
    return {reply:d.reply, sources:Array.isArray(d.sources) ? d.sources : []};
  } catch(e){
    return {reply:'No pude conectar con el motor de IA ('+String(e.message||'error').slice(0,180)+'). Los comandos locales siguen disponibles.',sources:[]};
  }
}

/* ==================== MANEJADOR ==================== */
async function handleUser(txt){
  const t = String(txt||'').trim();
  if (!t) return;
  addMessage(t,'user');

  const local = comandoLocal(t);
  if (local && local.handled){
    reply(local.reply,{speak:local.speak});
    return;
  }

  STATE.conversation.push({role:'user',content:t});
  showTyping();
  const res = await preguntarIA(t);
  hideTyping();

  if (res){
    STATE.conversation.push({role:'assistant',content:res.reply});
    while (STATE.conversation.length > STATE.maxHistory) STATE.conversation.shift();
    reply(res.reply,{fuentes:res.sources});
    return;
  }

  const n = norm(t);
  const investigar = /\b(investiga|investigacion|analiza|explica|que sabes de|quien fue|por que|como funciona|resumime|resume|compara|definicion de|que es)\b/.test(n);
  if (investigar){
    reply('Puedo conversar con un modelo avanzado y consultar fuentes, pero esa conexión no está configurada. Instalá las dependencias, agregá tu clave a .env y ejecutá npm start.');
  } else {
    reply('Estoy activo para comandos rápidos, pero no tengo un modelo de conversación conectado. Podés decir "abre YouTube", "busca en Google…", "calcula 24 * 7" o conectar la IA avanzada.');
  }
}

/* ==================== RECONOCIMIENTO DE VOZ ==================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let reconocedor = null, escuchando = false;
if (SR){
  reconocedor = new SR();
  reconocedor.lang = 'es-AR';
  reconocedor.continuous = false;
  reconocedor.interimResults = false;
  reconocedor.maxAlternatives = 1;
  reconocedor.onstart = () => { escuchando = true; micBtn.classList.add('listening'); body.classList.add('listening'); setStatus('ESCUCHANDO', STATE.aiAvailable); };
  reconocedor.onresult = e => {
    const r = e.results && e.results[e.results.length-1] && e.results[e.results.length-1][0] && e.results[e.results.length-1][0].transcript;
    if (r) handleUser(r);
  };
  reconocedor.onerror = e => {
    const msg = e.error === 'not-allowed' ? 'El navegador bloqueó el micrófono.' : e.error === 'no-speech' ? 'No detecté voz.' : 'No se pudo usar el micrófono ('+(e.error||'error')+').';
    addMessage(msg,'system');
  };
  reconocedor.onend = () => { escuchando = false; micBtn.classList.remove('listening'); body.classList.remove('listening'); setStatus(STATE.aiAvailable ? 'IA EN LÍNEA' : 'A SU SERVICIO', STATE.aiAvailable); };
} else {
  micBtn.title = 'Este navegador no soporta dictado';
}
micBtn.addEventListener('click',() => {
  if (!reconocedor){ addMessage('Este navegador no ofrece reconocimiento de voz. Probá Chrome o Edge.','system'); return; }
  if (escuchando){ try { reconocedor.stop(); } catch(_){} return; }
  try { if (STATE.speech) STATE.speech.cancel(); reconocedor.start(); }
  catch(_){ addMessage('No pude iniciar el micrófono. Esperá un momento.','system'); }
});

  const ctx = canvas.getContext('2d',{alpha:true});
  if (!ctx) return;
  let W = 0, H = 0, dpr = 1, ps = [], raf = 0;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = reduced ? 0 : Math.min(50, Math.floor(W*H/26000));
    ps = [];
    for (let i=0;i<count;i++) ps.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.4+.35});
    draw();
  }
  function draw(){
    cancelAnimationFrame(raf);
    ctx.clearRect(0,0,W,H);
    const col = getComputedStyle(document.documentElement).getPropertyValue('--cyan').trim() || '#48e4ff';
    const rgba = hexToRgba(col,.6);
    for (let i=0;i<ps.length;i++){
      const p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = rgba; ctx.fill();
      for (let j=i+1;j<ps.length;j++){
        const q = ps[j];
        const dx = p.x-q.x, dy = p.y-q.y, d2 = dx*dx+dy*dy;
        if (d2 < 13500){
          ctx.beginPath();
          ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
          ctx.strokeStyle = hexToRgba(col, (.10*(1-d2/13500)).toFixed(3));
          ctx.lineWidth = .7; ctx.stroke();
        }
      }
    }
    if (!reduced && !document.hidden) raf = requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',() => { if (document.hidden) cancelAnimationFrame(raf); else draw(); });
  resize();
  setInterval(() => { if (!document.hidden) draw(); }, 2000);
})();

/* ==================== ARRANQUE ==================== */
window.addEventListener('load', async () => {
  aplicarColor(STATE.colorReactor);
  await refreshHealth();
  setTimeout(() => $('#boot').classList.add('hidden'), 450);
  addMessage(
    'Buenas'+(STATE.apelativo?', '+STATE.apelativo:'')+'. Soy '+STATE.assistantName+', su asistente personal. '+
    'A su entera disposición. Puedo abrir sitios, buscar en YouTube, cambiar el color del reactor, hacer matemática avanzada y más. '+
    'Dígame qué necesita.',
    'bot', []
  );
  setTimeout(() => hablar('Buenas'+(STATE.apelativo?', '+STATE.apelativo:'')+'. Soy AGUS, su asistente personal. A su entera disposición. Dígame qué necesita.'), 800);
  if (STATE.voiceEnabled && !STATE.selectedVoice){
    setTimeout(() => addMessage('No encontré una voz identificable como masculina. El chat escrito funciona igual; instalá una voz masculina en el sistema.','system'), 400);
  }
});

document.addEventListener('visibilitychange',() => {
  if (!document.hidden && STATE.speech && STATE.speech.paused){
    try { STATE.speech.resume(); } catch(_){}
  }
});
