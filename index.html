<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="AGUS · Asistente personal con personalidad JARVIS, voz masculina, matemáticas y comandos por voz.">
<title>AGUS · Asistente Personal</title>
<style>
/* =========================================================
   RESET Y BASE
   ========================================================= */
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
html{
  height:100%;
  -webkit-text-size-adjust:100%;
}
body{
  height:100%;
  min-height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#050b13;
  color:#e4f7ff;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:fixed;
  inset:0;
  user-select:none;
  -webkit-user-select:none;
}

/* =========================================================
   VARIABLES DEL TEMA (se actualizan por JS)
   ========================================================= */
:root{
  --rgb:72,228,255;
  --hex:#48e4ff;
  --glow:rgba(72,228,255,.55);
  --glow-soft:rgba(72,228,255,.15);
  --glow-mid:rgba(72,228,255,.35);
  --border:rgba(72,228,255,.22);
  --border-strong:rgba(72,228,255,.45);
  --text:#e4f7ff;
  --muted:#83a4b8;
  --bg:#050b13;
  --panel:rgba(8,20,34,.82);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}

/* =========================================================
   FONDO ANIMADO
   ========================================================= */
#bgCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  opacity:.55;
  pointer-events:none;
}
.fondo-gradiente{
  position:fixed;
  inset:0;
  z-index:0;
  background:radial-gradient(ellipse at 50% -15%, var(--glow-soft) 0%, #071521 42%, #050b13 78%);
  transition:background 1s ease;
  pointer-events:none;
}
.fondo-scanlines{
  position:fixed;
  inset:0;
  z-index:1;
  background:repeating-linear-gradient(to bottom, var(--glow-soft) 0 1px, transparent 1px 4px);
  opacity:.14;
  pointer-events:none;
  mix-blend-mode:screen;
}
.fondo-vignette{
  position:fixed;
  inset:0;
  z-index:1;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%);
  pointer-events:none;
}

/* =========================================================
   LAYOUT PRINCIPAL
   ========================================================= */
.app{
  position:relative;
  z-index:2;
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr;
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
}

/* ---------- HEADER ---------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:calc(10px + var(--safe-top)) 14px 10px;
  background:rgba(4,12,22,.78);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  transition:border-color .5s ease;
  min-width:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex-shrink:1;
}
.logo{
  position:relative;
  flex:0 0 auto;
  width:36px;
  height:36px;
  border:2px solid var(--hex);
  border-radius:50%;
  box-shadow:0 0 18px var(--glow-soft), inset 0 0 12px var(--glow-soft);
  transition:all .5s ease;
}
.logo::after{
  content:'';
  position:absolute;
  inset:8px;
  border-radius:inherit;
  background:var(--hex);
  box-shadow:0 0 12px var(--glow);
  animation:latido 2.2s ease-in-out infinite;
  transition:background .5s ease;
}
.brand-txt{
  min-width:0;
  display:flex;
  flex-direction:column;
}
.brand-txt h1{
  color:#fff;
  font-size:17px;
  font-weight:800;
  letter-spacing:.24em;
  line-height:1.1;
  text-shadow:0 0 16px var(--glow);
  transition:text-shadow .5s ease;
}
.brand-txt small{
  color:var(--muted);
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-top:2px;
}
.header-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  flex-shrink:0;
}
.reloj{
  font-variant-numeric:tabular-nums;
  font-size:13px;
  color:#fff;
  letter-spacing:.04em;
  white-space:nowrap;
  padding:0 4px;
}
.estado{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--glow-soft);
  font-size:9px;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--hex);
  white-space:nowrap;
  transition:all .5s ease;
}
.punto{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ffbd70;
  box-shadow:0 0 8px currentColor;
  transition:background .3s ease;
}
.estado.vivo .punto{background:#56f0b0}
.estado.habla .punto{background:#ffbd70}

.boton-mini{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--glow-soft);
  color:var(--text);
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:15px;
  transition:all .2s ease;
  padding:0;
}
.boton-mini:active{
  transform:scale(.92);
  background:var(--glow-mid);
}
.boton-mini.on{background:var(--hex);color:#050b13;border-color:var(--hex)}

/* ---------- MAIN ---------- */
.main{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  gap:10px;
  padding:10px;
  min-height:0;
  overflow:hidden;
}

/* ---------- PANEL REACTOR ---------- */
.panel-nucleo{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:16px;
  background:linear-gradient(135deg, rgba(9,32,48,.5), rgba(3,10,18,.28));
  transition:border-color .5s ease;
  min-width:0;
}
.reactor{
  position:relative;
  flex:0 0 auto;
  width:66px;
  height:66px;
  display:grid;
  place-items:center;
}
.anillo{
  position:absolute;
  inset:0;
  border:1px solid var(--border);
  border-radius:50%;
  transition:border-color .5s ease;
}
.anillo.a1{
  border-top-color:var(--hex);
  border-bottom-color:var(--hex);
  animation:giro 10s linear infinite;
  box-shadow:0 0 18px -6px var(--hex);
}
.anillo.a2{
  inset:12%;
  border-left-color:var(--hex);
  border-right-color:var(--hex);
  animation:giro 7s linear infinite reverse;
}
.anillo.a3{
  inset:24%;
  border-top-color:var(--hex);
  animation:giro 4s linear infinite;
}
.marcas{
  position:absolute;
  inset:-5%;
  border-radius:50%;
  opacity:.4;
  background:repeating-conic-gradient(var(--hex) 0deg 1.2deg, transparent 1.2deg 7.5deg);
  -webkit-mask:radial-gradient(circle, transparent 66%, #000 67%);
  mask:radial-gradient(circle, transparent 66%, #000 67%);
  animation:giro 30s linear infinite;
  transition:background .5s ease;
}
.nucleo{
  width:40%;
  height:40%;
  border-radius:50%;
  background:radial-gradient(circle, #fff 0%, var(--hex) 25%, var(--hex) 50%, rgba(0,0,0,.65) 78%, transparent 100%);
  box-shadow:0 0 32px var(--glow), inset 0 0 18px #fff;
  animation:latido 2.6s ease-in-out infinite;
  transition:background .5s ease, box-shadow .5s ease;
}
body.hablando .nucleo{
  background:radial-gradient(circle,#fff 0,#ffe2be 25%,#ffbd70 50%,rgba(0,0,0,.65) 78%,transparent 100%);
  box-shadow:0 0 32px rgba(255,189,112,.7);
}
body.escuchando .nucleo{
  background:radial-gradient(circle,#fff 0,#c8ffe8 25%,#56f0b0 50%,rgba(0,0,0,.65) 78%,transparent 100%);
  box-shadow:0 0 32px rgba(86,240,176,.7);
}
.info-nucleo{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.etiqueta-nucleo{
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
.estado-nucleo{
  font-size:13px;
  font-weight:800;
  letter-spacing:.1em;
  color:#fff;
  text-shadow:0 0 12px var(--glow);
  transition:text-shadow .5s ease;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ayuda-nucleo{
  font-size:11px;
  color:var(--muted);
  line-height:1.35;
  margin-top:2px;
}

/* ---------- PANEL CHAT ---------- */
.panel-chat{
  display:flex;
  flex-direction:column;
  min-height:0;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 0 60px var(--glow-soft);
  overflow:hidden;
  transition:border-color .5s ease;
}
.chat-cabecera{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:11px 14px;
  border-bottom:1px solid var(--border);
  transition:border-color .5s ease;
}
.chat-cabecera h2{
  font-size:13px;
  font-weight:700;
  color:#fff;
  letter-spacing:.04em;
}
.pastilla-modo{
  padding:3px 9px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--glow-soft);
  color:var(--hex);
  font-size:9px;
  font-weight:700;
  letter-spacing:.08em;
  transition:all .5s ease;
  white-space:nowrap;
}

.mensajes{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.mensajes::-webkit-scrollbar{width:4px}
.mensajes::-webkit-scrollbar-thumb{background:var(--glow-mid);border-radius:4px}
.mensajes::-webkit-scrollbar-track{background:transparent}

.msg{
  max-width:88%;
  padding:10px 13px;
  border-radius:4px 14px 14px 14px;
  align-self:flex-start;
  font-size:14px;
  line-height:1.55;
  word-wrap:break-word;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  animation:entrada .25s ease both;
  border:1px solid var(--border);
  border-left:2px solid var(--hex);
  background:var(--glow-soft);
  color:#e0f6ff;
  transition:border-color .5s ease;
}
.msg.yo{
  align-self:flex-end;
  border-radius:14px 4px 14px 14px;
  border-left:1px solid var(--border);
  border-right:2px solid var(--hex);
  background:var(--glow-soft);
  color:#fff;
}
.msg.sistema,.msg.accion{
  align-self:center;
  max-width:96%;
  text-align:center;
  border-radius:999px;
  padding:7px 12px;
  font-size:11px;
  background:rgba(255,189,112,.08);
  border:1px solid rgba(255,189,112,.28);
  color:#ffd9ae;
}
.msg.accion{
  background:var(--glow-soft);
  border-color:var(--border-strong);
  color:#d6f8ff;
}
.quien{
  display:block;
  font-size:9px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:4px;
  color:var(--hex);
  transition:color .5s ease;
}
.yo .quien{color:var(--hex)}

.msg a{
  color:var(--hex);
  text-decoration:underline;
  text-underline-offset:3px;
  transition:color .5s ease;
}

.fuentes{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid var(--border);
  font-size:11px;
}
.fuentes-titulo{
  color:var(--muted);
  font-weight:700;
  letter-spacing:.05em;
}

.escribiendo{
  display:flex;
  gap:5px;
  padding:14px 16px;
  min-width:60px;
}
.escribiendo i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--hex);
  animation:parpadeo 1.1s infinite;
}
.escribiendo i:nth-child(2){animation-delay:.15s}
.escribiendo i:nth-child(3){animation-delay:.3s}

/* ---------- CHIPS ---------- */
.chips{
  display:flex;
  gap:6px;
  padding:0 10px 10px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--glow-soft);
  color:#cfeef8;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s ease;
  font-family:inherit;
}
.chip:active{
  transform:scale(.94);
  background:var(--glow-mid);
  color:#fff;
}

/* ---------- INPUT BAR ---------- */
.barra-input{
  display:flex;
  gap:7px;
  align-items:center;
  padding:9px 10px max(9px, var(--safe-bottom));
  border-top:1px solid var(--border);
  background:rgba(3,10,18,.78);
  transition:border-color .5s ease;
}
.campo{
  flex:1;
  min-width:0;
  height:44px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(0,0,0,.3);
  color:#effbff;
  font-size:16px;
  font-family:inherit;
  outline:none;
  transition:all .25s ease;
}
.campo:focus{
  border-color:var(--hex);
  box-shadow:0 0 0 3px var(--glow-soft);
}
.campo::placeholder{color:#7392a4}

.boton-redondo{
  flex:0 0 auto;
  width:44px;
  height:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--glow-soft);
  color:var(--hex);
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:17px;
  transition:all .2s ease;
  padding:0;
  font-family:inherit;
}
.boton-redondo:active{transform:scale(.92)}
.boton-redondo.mic.on{
  background:#56f0b0;
  color:#04251a;
  border-color:#56f0b0;
  box-shadow:0 0 20px rgba(86,240,176,.4);
  animation:latido 1.1s infinite;
}
.boton-redondo.enviar{
  background:var(--hex);
  color:#050b13;
  border-color:var(--hex);
  font-weight:900;
}
.pie{
  padding:0 12px 7px;
  font-size:9px;
  text-align:center;
  color:#6d8da0;
  background:rgba(3,10,18,.78);
}

/* ---------- BOOT ---------- */
.arranque{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-content:center;
  justify-items:center;
  gap:14px;
  background:#040a12;
  transition:opacity .6s ease, visibility .6s ease;
}
.arranque.oculto{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.arranque-orb{
  width:76px;
  height:76px;
  border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--hex) 25%,var(--hex) 52%,transparent 80%);
  box-shadow:0 0 60px var(--glow-soft);
  animation:latido 1.3s ease-in-out infinite;
  transition:background .5s ease;
}
.arranque-nombre{
  color:#fff;
  font-size:22px;
  font-weight:800;
  letter-spacing:.4em;
  text-shadow:0 0 24px var(--glow);
}
.arranque-texto{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
  text-align:center;
  padding:0 24px;
}

/* =========================================================
   ANIMACIONES
   ========================================================= */
@keyframes latido{
  0%,100%{opacity:.85;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes entrada{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes parpadeo{
  0%,100%{opacity:.25;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-3px)}
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (min-width:780px){
  .main{
    grid-template-columns:minmax(260px,.9fr) minmax(0,1.6fr);
    grid-template-rows:minmax(0,1fr);
    gap:16px;
    padding:16px;
  }
  .panel-nucleo{
    flex-direction:column;
    justify-content:center;
    text-align:center;
    gap:16px;
    padding:20px;
  }
  .reactor{width:180px;height:180px}
  .info-nucleo{align-items:center}
  .etiqueta-nucleo{display:block}
  .estado-nucleo{font-size:16px}
  .ayuda-nucleo{display:block;max-width:280px;text-align:center}
  .msg{font-size:14.5px}
}

@media (max-width:480px){
  .header{padding:calc(8px + var(--safe-top)) 10px 8px}
  .logo{width:32px;height:32px}
  .logo::after{inset:7px}
  .brand-txt h1{font-size:15px;letter-spacing:.2em}
  .brand-txt small{display:none}
  .reloj{font-size:11px}
  .estado{padding:4px 7px;font-size:8px}
  .boton-mini{width:32px;height:32px;font-size:14px}
  .main{gap:8px;padding:8px}
  .panel-nucleo{padding:8px 12px;gap:10px;border-radius:14px}
  .reactor{width:56px;height:56px}
  .nucleo{width:44%;height:44%}
  .estado-nucleo{font-size:11px}
  .ayuda-nucleo{display:none}
  .panel-chat{border-radius:14px}
  .chat-cabecera{padding:10px 12px}
  .chat-cabecera h2{font-size:12px}
  .pastilla-modo{font-size:8px;padding:3px 8px}
  .mensajes{padding:10px;gap:9px}
  .msg{font-size:13.5px;padding:9px 12px;max-width:92%}
  .chips{padding:0 8px 8px;gap:5px}
  .chip{padding:6px 10px;font-size:10.5px}
  .barra-input{padding:8px 8px max(8px, var(--safe-bottom));gap:6px}
  .campo{height:42px;font-size:16px}
  .boton-redondo{width:42px;height:42px;font-size:16px}
}

@media (max-width:360px){
  .brand-txt h1{font-size:13px}
  .reloj{display:none}
  .msg{font-size:13px}
}

@media (orientation:landscape) and (max-height:480px){
  .panel-nucleo{display:none}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<!-- ==================== ARRANQUE ==================== -->
<div class="arranque" id="arranque">
  <div class="arranque-orb"></div>
  <div class="arranque-nombre">AGUS</div>
  <div class="arranque-texto" id="arranqueTexto">Inicializando sistemas…</div>
</div>

<!-- ==================== FONDO ==================== -->
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="fondo-gradiente" aria-hidden="true"></div>
<div class="fondo-scanlines" aria-hidden="true"></div>
<div class="fondo-vignette" aria-hidden="true"></div>

<!-- ==================== APP ==================== -->
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brand-txt">
        <h1>AGUS</h1>
        <small>Sistema de asistencia</small>
      </div>
    </div>
    <div class="header-right">
      <div class="reloj" id="reloj">--:--</div>
      <div class="estado vivo" id="estado">
        <span class="punto"></span>
        <span id="estadoTexto">LISTO</span>
      </div>
      <button class="boton-mini on" id="btnVoz" type="button" title="Activar o silenciar voz">🔊</button>
      <button class="boton-mini" id="btnLimpiar" type="button" title="Limpiar">🧹</button>
    </div>
  </header>

  <main class="main">

    <!-- PANEL NÚCLEO -->
    <section class="panel-nucleo" aria-label="Estado del núcleo">
      <div class="reactor" aria-hidden="true">
        <div class="marcas"></div>
        <div class="anillo a1"></div>
        <div class="anillo a2"></div>
        <div class="anillo a3"></div>
        <div class="nucleo"></div>
      </div>

function norm(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[¿?¡!.,;:]+/g, ' ')

}

function fmtNum(n) {

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return { r, g, b };
}
function rgbToHex(r, g, b) {
  const to = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  return '#' + to(r) + to(g) + to(b);
}
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
}

/* =========================================================================
   ANIMACIÓN DE FONDO CON PARTÍCULAS
   ========================================================================= */
(function iniciarFondo() {
  const canvas = DOM.canvas;
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;

  let W = 0, H = 0, dpr = 1;
  let particulas = [];
  let raf = 0;
  const reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function redimensionar() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cantidad = reducido ? 0 : Math.min(48, Math.floor((W * H) / 26000));
    particulas = [];
    for (let i = 0; i < cantidad; i++) {
      particulas.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.3 + 0.3
      });
    }
    dibujar();
  }

  function dibujar() {
    cancelAnimationFrame(raf);
    ctx.clearRect(0, 0, W, H);

    const col = getComputedStyle(document.documentElement).getPropertyValue('--hex').trim() || '#48e4ff';
    const { r, g, b } = hexToRgb(col);
    const fill = 'rgba(' + r + ',' + g + ',' + b + ',.55)';

    for (let i = 0; i < particulas.length; i++) {
      const p = particulas[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();

      for (let j = i + 1; j < particulas.length; j++) {
        const q = particulas[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 13500) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          const alpha = (0.1 * (1 - d2 / 13500)).toFixed(3);
          ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }

    if (!reducido && !document.hidden) {
      raf = requestAnimationFrame(dibujar);
    }
  }

  window.addEventListener('resize', redimensionar, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else dibujar();
  });
  redimensionar();

  // Redibujar cada 2 segundos para actualizar color de partículas
  setInterval(() => {
    if (!document.hidden) {
      const actual = getComputedStyle(document.documentElement).getPropertyValue('--hex').trim();
      if (actual !== canvas.dataset.color) {
        canvas.dataset.color = actual;
        dibujar();
      }
    }
  }, 2000);
})();

function esVozFemenina(v) {
  if (!v) return false;
  const n = (v.name || '').toLowerCase();

function esVozMasculina(v) {

function seleccionarMejorVoz() {
  if (!STATE.synth) return null;
  const voces = STATE.synth.getVoices() || [];
  if (!voces.length) return null;

  // Solo voces en español
  const enEspanol = voces.filter(v => /^es/i.test(v.lang));
  if (!enEspanol.length) return null;

  // 1) Masculina en español
  let elegida = enEspanol.find(v => esVozMasculina(v) && !esVozFemenina(v));
  if (elegida) return elegida;

  // 2) Cualquier voz en español que NO sea femenina
  elegida = enEspanol.find(v => !esVozFemenina(v));
  if (elegida) return elegida;

  // 3) Primera en español
  return enEspanol[0];
}

function cargarVoces() {
  if (!STATE.synth) return;
  const elegida = seleccionarMejorVoz();

    DOM.modo.textContent = 'VOZ: ' + elegida.name.slice(0, 18).toUpperCase();

  setTimeout(cargarVoces, 300);

function hablar(texto) {
  if (!STATE.vozActiva || !STATE.synth) return;
  try {
    STATE.synth.cancel();
    if (!STATE.vozSeleccionada) cargarVoces();

    const limpio = String(texto)
      .replace(/https?:\/\/\S+/g, 'enlace web')
      .replace(/[`*_#>|]/g, '')
      .replace(/\n+/g, '. ')
      .slice(0, 2200);

    if (!limpio.trim()) return;

    const u = new SpeechSynthesisUtterance(limpio);
    if (STATE.vozSeleccionada) u.voice = STATE.vozSeleccionada;
    u.lang = (STATE.vozSeleccionada && STATE.vozSeleccionada.lang) || 'es-ES';
    u.rate = 1.02;   // Natural, no robótico
    u.pitch = 0.85;  // Masculino sin exagerar
    u.volume = 1;

    u.onstart = () => {
      STATE.hablando = true;
      DOM.body.classList.add('hablando');
      setEstado('Hablando', 'habla');
    };
    u.onend = u.onerror = () => {
      STATE.hablando = false;
      DOM.body.classList.remove('hablando');
      setEstado(STATE.escuchando ? 'Escuchando' : 'Listo', 'vivo');
    };

    STATE.synth.speak(u);
  } catch (_) {
    DOM.body.classList.remove('hablando');
  }
}

/* =========================================================================
   MOTOR MATEMÁTICO
   ========================================================================= */
const MotorMat = (() => {
  function limpiar(s) {
    s = String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    s = s.replace(/^(?:por favor\s+)?(?:calcula(?:me)?|cuanto es|cuanto da|cuanto vale|resuelve|resultado de|evalua|opera)\s+/i, '');
    s = s.replace(/[×✕]/g, '*').replace(/[÷]/g, '/').replace(/\^\^/g, '^').replace(/\*\*/g, '^');
    s = s.replace(/raiz cuadrada de\s*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*\)?/g, 'sqrt($1)');
    s = s.replace(/raiz cubica de\s*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*\)?/g, 'cbrt($1)');
    s = s.replace(/raiz de\s*\(?\s*([0-9]+(?:\.[0-9]+)?)\s*\)?/g, 'sqrt($1)');
    s = s.replace(/([0-9]+(?:\.[0-9]+)?)\s+al cuadrado/g, '($1)^2');
    s = s.replace(/([0-9]+(?:\.[0-9]+)?)\s+al cubo/g, '($1)^3');
    s = s.replace(/\belevado a\b/g, '^')
         .replace(/\bdividido (?:por|entre)\b/g, '/')
         .replace(/\bentre\b/g, '/')
         .replace(/\bmultiplicado por\b/g, '*')
         .replace(/\bpor\b/g, '*')
         .replace(/\bmas\b/g, '+')
         .replace(/\bmenos\b/g, '-');
    s = s.replace(/,\s*/g, '.').replace(/\s+/g, '');
    return s;
  }

  function evaluar(expr) {
    try {
      const s = limpiar(expr);
      if (!s) return null;
      const tokens = s.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[a-z]+|[()+\-*/%^!]/g);
      if (!tokens || !tokens.length) return null;
      if (tokens.join('') !== s) return null;

      const funcs = {
        sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
        sin: Math.sin, sen: Math.sin, cos: Math.cos, tan: Math.tan,
        log: Math.log10, log10: Math.log10, ln: Math.log, log2: Math.log2,
        exp: Math.exp, floor: Math.floor, ceil: Math.ceil, round: Math.round,
        pi: () => Math.PI, e: () => Math.E
      };

      function fact(n) {
        if (!Number.isInteger(n) || n < 0 || n > 170) throw new Error('factorial');
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
      }

      let i = 0;
      const peek = () => tokens[i];
      const take = () => tokens[i++];

      function primary() {
        const t = take();
        if (t === undefined) throw new Error('incompleto');
        if (t === '(') {
          const v = expression();
          if (take() !== ')') throw new Error('paren');
          return v;
        }
        if (/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/.test(t)) return parseFloat(t);
        if (t === 'pi') return Math.PI;
        if (t === 'e') return Math.E;
        if (Object.prototype.hasOwnProperty.call(funcs, t)) {
          let arg;
          if (peek() === '(') {
            take();
            arg = expression();
            if (take() !== ')') throw new Error('paren');
          } else {
            arg = unary();
          }
          return funcs[t](arg);
        }
        throw new Error('token ' + t);
      }
      function postfix() {
        let v = primary();
        while (peek() === '!') {
          take();
          v = fact(v);
        }
        return v;
      }
      function power() {
        const b = postfix();
        if (peek() === '^') {
          take();
          return b ** unary();
        }
        return b;
      }
      function unary() {
        if (peek() === '+') { take(); return unary(); }
        if (peek() === '-') { take(); return -unary(); }
        return power();
      }
      function term() {
        let v = unary();
        while (['*', '/', '%'].includes(peek())) {
          const op = take();
          const r = unary();
          if ((op === '/' || op === '%') && r === 0) throw new Error('div0');
          if (op === '*') v *= r;
          if (op === '/') v /= r;
          if (op === '%') v %= r;
        }
        return v;
      }
      function expression() {
        let v = term();
        while (peek() === '+' || peek() === '-') {
          const op = take();
          const r = term();
          v = op === '+' ? v + r : v - r;
        }
        return v;
      }
      const r = expression();
      if (i !== tokens.length || !Number.isFinite(r)) return null;
      return Math.abs(r) < 1e-12 ? 0 : Number(r.toPrecision(12));
    } catch (_) {
      return null;
    }
  }

  function esPrimo(n) {
    n = Math.floor(n);
    if (n < 2) return false;
    if (n < 4) return true;
    if (n % 2 === 0) return false;
    const lim = Math.floor(Math.sqrt(n));
    for (let i = 3; i <= lim; i += 2) if (n % i === 0) return false;
    return true;
  }

  function factores(n) {
    n = Math.floor(n);
    if (n < 2) return [];
    const r = [];
    let d = 2;
    while (n > 1) {
      while (n % d === 0) { r.push(d); n /= d; }
      d++;
      if (d * d > n && n > 1) { r.push(n); break; }
    }
    return r;
  }

  function fib(n) {
    n = Math.floor(n);
    if (n < 0 || n > 100) return null;
    if (n === 0) return 0;
    if (n === 1) return 1;
    let a = 0, b = 1, c;
    for (let i = 2; i <= n; i++) { c = a + b; a = b; b = c; }
    return b;
  }

  function mcd(a, b) {
    a = Math.abs(Math.floor(a));
    b = Math.abs(Math.floor(b));
    while (b) { const t = b; b = a % b; a = t; }
    return a;
  }

  function mcm(a, b) {
    a = Math.abs(Math.floor(a));
    b = Math.abs(Math.floor(b));
    if (!a || !b) return 0;
    return (a * b) / mcd(a, b);
  }

  function est(nums) {
    const n = nums.length;
    if (!n) return null;
    const suma = nums.reduce((a, b) => a + b, 0);
    const media = suma / n;
    const ord = nums.slice().sort((a, b) => a - b);
    const mediana = n % 2 ? ord[(n - 1) / 2] : (ord[n / 2 - 1] + ord[n / 2]) / 2;
    const cnt = {};
    ord.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    let moda = [], max = 0;
    for (const k in cnt) {
      if (cnt[k] > max) { max = cnt[k]; moda = [parseFloat(k)]; }
      else if (cnt[k] === max) moda.push(parseFloat(k));
    }
    const varz = nums.reduce((a, b) => a + Math.pow(b - media, 2), 0) / n;
    return { suma, media, mediana, moda, varianza: varz, desv: Math.sqrt(varz), min: ord[0], max: ord[n - 1] };
  }

  function cuad(a, b, c) {
    const disc = b * b - 4 * a * c;
    if (disc < 0) {
      const re = -b / (2 * a), im = Math.sqrt(-disc) / (2 * a);
      return { tipo: 'complejas', x1: re + ' + ' + im.toFixed(4) + 'i', x2: re + ' - ' + im.toFixed(4) + 'i' };
    }
    if (disc === 0) return { tipo: 'doble', x1: -b / (2 * a) };
    return { tipo: 'reales', x1: (-b + Math.sqrt(disc)) / (2 * a), x2: (-b - Math.sqrt(disc)) / (2 * a) };
  }

  return { evaluar, esPrimo, factores, fib, mcd, mcm, est, cuad };
})();

/* =========================================================================
   PROCESADOR MATEMÁTICO
   ========================================================================= */
function procesarMate(texto) {
  const t = norm(texto);
  let m;

  m = t.match(/(?:es\s+primo|numero\s+primo|verifica\s+si\s+es\s+primo)\s+(?:el\s+)?(?:numero\s+)?(\d+)/);
  if (m) {
    const n = parseInt(m[1], 10);
    return MotorMat.esPrimo(n)
      ? 'Sí' + apeFin() + ', ' + n + ' es un número primo.'
      : 'No' + apeFin() + ', ' + n + ' no es primo.';
  }

  m = t.match(/(?:factores\s+primos?\s+de|descompone\s+en\s+factores|factoriza)\s+(\d+)/);
  if (m) {
    const n = parseInt(m[1], 10);
    const f = MotorMat.factores(n);
    if (f.length) return 'Los factores primos de ' + n + ' son: ' + f.join(' × ') + ' = ' + n + '.';
  }

  m = t.match(/fibonacci\s+(?:de\s+|numero\s+)?(\d+)/);
  if (m) {
    const n = parseInt(m[1], 10);
    const r = MotorMat.fib(n);
    if (r !== null) return 'El número de Fibonacci número ' + n + ' es ' + r + '.';
  }

  m = t.match(/(?:factorial\s+de|el\s+factorial\s+de)\s+(\d+)/);
  if (m) {
    const n = parseInt(m[1], 10);
    if (n > 170) return 'El número es demasiado grande para calcular su factorial.';
    return 'El factorial de ' + n + ' es ' + MotorMat.evaluar(n + '!') + '.';
  }

  m = t.match(/(?:mcd|maximo\s+comun\s+divisor)\s*(?:de)?\s*(\d+)\s*(?:y|,)\s*(\d+)/);
  if (m) return 'El MCD de ' + m[1] + ' y ' + m[2] + ' es ' + MotorMat.mcd(parseInt(m[1], 10), parseInt(m[2], 10)) + '.';

  m = t.match(/(?:mcm|minimo\s+comun\s+multiplo)\s*(?:de)?\s*(\d+)\s*(?:y|,)\s*(\d+)/);
  if (m) return 'El MCM de ' + m[1] + ' y ' + m[2] + ' es ' + MotorMat.mcm(parseInt(m[1], 10), parseInt(m[2], 10)) + '.';

  m = texto.match(/(-?\d*)\s*x\s*(?:\^?2)?\s*([+\-]\s*\d*)\s*x\s*([+\-]\s*\d+)?\s*=\s*0/i);
  if (m) {
    const a = (m[1] === '' || m[1] === '+') ? 1 : (m[1] === '-' ? -1 : parseInt(m[1], 10));
    const bStr = (m[2] || '').replace(/\s+/g, '');
    const cStr = (m[3] || '').replace(/\s+/g, '');
    const b = bStr === '+x' ? 1 : bStr === '-x' ? -1 : parseInt(bStr, 10);
    const c = cStr ? parseInt(cStr, 10) : 0;
    if (isFinite(a) && isFinite(b) && isFinite(c) && a !== 0) {
      const r = MotorMat.cuad(a, b, c);
      if (r.tipo === 'reales') return 'Ecuación: ' + a + 'x² + ' + b + 'x + ' + c + ' = 0\nSoluciones: x₁ = ' + fmtNum(r.x1) + ', x₂ = ' + fmtNum(r.x2);
      if (r.tipo === 'doble') return 'Ecuación: ' + a + 'x² + ' + b + 'x + ' + c + ' = 0\nSolución doble: x = ' + fmtNum(r.x1);
      return 'Ecuación: ' + a + 'x² + ' + b + 'x + ' + c + ' = 0\nSoluciones complejas: x₁ = ' + r.x1 + ', x₂ = ' + r.x2;
    }
  }

  m = t.match(/(media|promedio|mediana|moda|desviacion\s+estandar|varianza|estadisticas?)\s+(?:de\s+)?([\d\s,.;]+)/);
  if (m) {
    const nums = m[2].split(/[\s,;.]+/).map(parseFloat).filter(n => isFinite(n));
    if (nums.length >= 2) {
      const e = MotorMat.est(nums);
      if (/media|promedio/.test(m[1])) return 'La media de [' + nums.join(', ') + '] es ' + fmtNum(e.media) + '.';
      if (/mediana/.test(m[1])) return 'La mediana es ' + fmtNum(e.mediana) + '.';
      if (/moda/.test(m[1])) return 'La moda es ' + e.moda.join(', ') + '.';
      if (/desviacion/.test(m[1])) return 'La desviación estándar es ' + fmtNum(e.desv) + '.';
      if (/varianza/.test(m[1])) return 'La varianza es ' + fmtNum(e.varianza) + '.';
      return 'Estadísticas:\n• Suma: ' + e.suma + '\n• Media: ' + fmtNum(e.media) + '\n• Mediana: ' + fmtNum(e.mediana) + '\n• Moda: ' + e.moda.join(', ') + '\n• Mín: ' + e.min + '\n• Máx: ' + e.max + '\n• Desv: ' + fmtNum(e.desv);
    }
  }

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:%|por\s*ciento)\s*(?:de|del)\s*(\d+(?:[.,]\d+)?)/);
  if (m) {
    const p = parseFloat(m[1].replace(',', '.'));
    const n = parseFloat(m[2].replace(',', '.'));
    return 'El ' + p + '% de ' + n + ' es ' + fmtNum((p * n) / 100) + '.';
  }

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:grados?\s+)?(celsius|centigrados?|°c)\s+a\s+(fahrenheit|°f)/);
  if (m) return m[1] + ' °C = ' + fmtNum(parseFloat(m[1].replace(',', '.')) * 9 / 5 + 32) + ' °F.';

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(?:grados?\s+)?(fahrenheit|°f)\s+a\s+(celsius|centigrados?|°c)/);
  if (m) return m[1] + ' °F = ' + fmtNum((parseFloat(m[1].replace(',', '.')) - 32) * 5 / 9) + ' °C.';

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(km|kilometros?)\s+a\s+(millas?|mi)/);
  if (m) return m[1] + ' km = ' + fmtNum(parseFloat(m[1].replace(',', '.')) * 0.621371) + ' millas.';

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(millas?|mi)\s+a\s+(km|kilometros?)/);
  if (m) return m[1] + ' millas = ' + fmtNum(parseFloat(m[1].replace(',', '.')) * 1.60934) + ' km.';

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilogramos?)\s+a\s*(libras?|lb)/);
  if (m) return m[1] + ' kg = ' + fmtNum(parseFloat(m[1].replace(',', '.')) * 2.20462) + ' libras.';

  m = t.match(/(\d+(?:[.,]\d+)?)\s*(libras?|lb)\s+a\s*(kg|kilogramos?)/);
  if (m) return m[1] + ' libras = ' + fmtNum(parseFloat(m[1].replace(',', '.')) * 0.453592) + ' kg.';

  if (/^(?:calcula(?:me)?|cuanto es|cuanto da|cuanto vale|resuelve|resultado de|evalua|opera|raiz cuadrada de|raiz de)\b/.test(t)) {
    const r = MotorMat.evaluar(texto);
    if (r !== null) return fraseJarvis() + ' El resultado es ' + fmtNum(r) + '.';
    return 'No pude interpretar esa operación. Probá con "calcula 24 * 7", "raíz cuadrada de 144" o "(5 + 3)^2".';
  }

  if (/^[\d\s+\-*/%^().,!]+$/.test(texto.trim()) && /[+\-*/%^!]/.test(texto)) {
    const r = MotorMat.evaluar(texto);
    if (r !== null) return 'El resultado es ' + fmtNum(r) + '.';
  }

  return null;
}

const SITIOS_FLAT = SITIOS.flatMap(s => s.k.map(k => ({ k, sitio: s })))
  .sort((a, b) => b.k.length - a.k.length);

function detectarSitio(destino) {
  let valor = norm(destino)
    .replace(/\b(ahora|rapido|rapidamente|por favor|ya mismo|ya)\b/g, '')
    .trim();
  valor = valor.replace(/^(la pagina de |pagina de |el sitio de |sitio de |la web de |web de |la app de |app de )/, '').trim();

  for (const e of SITIOS_FLAT) {
    const c = norm(e.k);
    if (valor === c || valor === 'www ' + c || valor.startsWith(c + ' ')) {
      return e.sitio;
    }
  }

  const host = String(destino || '').trim().replace(/[.,!?]+$/, '');
  if (/^https?:\/\//i.test(host)) {
    try {
      const u = new URL(host);
      if (u.hostname.includes('.') && !u.username && !u.password) {
        return { u: u.href, l: u.hostname };
      }
    } catch (_) {}
  }

  if (/^(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?$/i.test(host)) {
    try {
      const u = new URL('https://' + host.replace(/^https?:\/\//i, ''));
      if (!u.username && !u.password) return { u: u.href, l: u.hostname };
    } catch (_) {}
  }

  return null;
}

function abrirUrl(url, etiqueta) {
  let v;
  try { v = new URL(url); } catch (_) { return false; }
  if (!['https:', 'http:'].includes(v.protocol)) return false;

  let win = null;
  try {
    win = window.open(v.href, '_blank');
    if (win) win.opener = null;
  } catch (_) {
    win = null;
  }

  if (win) {
    agregarMensaje('Abriendo ' + etiqueta + '.', 'accion');
  } else {
    const div = document.createElement('div');
    div.className = 'msg accion';
    div.appendChild(document.createTextNode('El navegador bloqueó la pestaña. Enlace manual: '));
    const a = document.createElement('a');
    a.href = v.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = 'Abrir ' + etiqueta;
    div.appendChild(a);
    DOM.mensajes.appendChild(div);
    scrollAbajo();
  }
  return true;
}

function buscarEn(q, donde) {
  q = String(q || '').trim();
  if (!q) return false;
  const url = donde === 'youtube'
    ? 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q)
    : 'https://www.google.com/search?q=' + encodeURIComponent(q);
  return abrirUrl(url, donde === 'youtube' ? 'la búsqueda de YouTube' : 'la búsqueda de Google');
}

/* =========================================================================
   PERSONALIZACIÓN (obediencia total)
   ========================================================================= */
function procesarPersonalizacion(texto) {
  const t = norm(texto);

  // "no me digas X"
  let m = texto.match(/(?:no\s+me\s+digas|no\s+me\s+llames|deja\s+de\s+decirme|no\s+me\s+trates\s+de|no\s+quiero\s+que\s+me\s+digas)\s+([\p{L}][\p{L}\p{M}]{0,30})/iu);
  if (m) {
    const bl = m[1].toLowerCase();
    if (STATE.apelativo && STATE.apelativo.toLowerCase() === bl) {
      STATE.apelativo = '';
      guardar();
      return 'Entendido. Dejaré de dirigirme a usted como "' + m[1] + '".';
    }
    return 'Entendido. No le llamaré "' + m[1] + '".';
  }

  // "no me digas señor"
  if (/(no\s+me\s+digas\s+se[ñn]or|no\s+me\s+llames\s+se[ñn]or|sin\s+se[ñn]or)/.test(t)) {
    STATE.apelativo = '';
    guardar();
    return 'Entendido, ' + STATE.nombreUsuario + '. No volveré a decirte "señor".';
  }

  // "llámame X" / "dime X" / "mi nombre es X" / "quiero que me llames X"
  m = texto.match(/(?:mi\s+nombre\s+es|ll[aá]mame(?:\s+como)?|puedes\s+llamarme|quiero\s+que\s+me\s+llames|tr[aá]tame\s+como|refi[eé]rete\s+a\s+m[ií]\s+como)\s+([\p{L}][\p{L}\p{M}'\-]{0,30})/iu);
  if (m) {
    const nuevo = m[1].trim().replace(/[^\p{L}\p{M}'\- ]/gu, '');
    if (nuevo) {
      STATE.nombreUsuario = nuevo.charAt(0).toUpperCase() + nuevo.slice(1).toLowerCase();
      STATE.apelativo = STATE.nombreUsuario;
      guardar();
      return 'Entendido, ' + STATE.nombreUsuario + '. A partir de ahora me dirigiré a usted así.';
    }
  }

  // "dime X" solo si X no es palabra común
  m = texto.match(/^dime\s+([\p{L}][\p{L}\p{M}'\-]{0,30})/iu);
  if (m) {
    const palabra = m[1].toLowerCase();
    const COMUNES = /^(algo|una|un|la|el|los|las|que|qu[eé]|como|c[oó]mo|donde|d[oó]nde|cuando|cu[aá]ndo|por|para|si|no|tu|mi|su|otra|otro|esta|este|esa|ese|mas|m[aá]s|hola|chau|adios|todo|nada|un chiste|un cuento|un dato|una curiosidad)$/i;
    if (!COMUNES.test(palabra)) {
      STATE.nombreUsuario = palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();
      STATE.apelativo = STATE.nombreUsuario;
      guardar();
      return 'Entendido, ' + STATE.nombreUsuario + '. A partir de ahora me dirigiré a usted así.';
    }
  }

  // "vuelve a decirme señor"
  if (/(?:vuelve\s+a\s+decirme|tr[aá]tame\s+de)\s+se[ñn]or/.test(t)) {
    STATE.apelativo = 'Señor';
    guardar();
    return 'Como usted diga, Señor.';
  }

  // "sin títulos"
  if (/(sin\s+t[ií]tulos?|no\s+uses?\s+t[ií]tulos?|no\s+me\s+pongas?\s+t[ií]tulos?|sin\s+formalidades)/.test(t)) {
    STATE.apelativo = '';
    guardar();
    return 'Entendido. Hablaré sin títulos ni apelativos.';
  }

  // Consultar
  if (/(c[oó]mo\s+me\s+llamas|c[oó]mo\s+me\s+llamo|cu[aá]l\s+es\s+mi\s+nombre)/.test(t)) {
    if (STATE.apelativo) return 'Me dirijo a usted como "' + STATE.apelativo + '". Si quiere cambiarlo, diga "llámame [nombre]".';
    return 'Actualmente no uso ningún apelativo. Podés decirme "llámame [nombre]".';
  }

  return null;
}

/* =========================================================================
   TEMPORIZADORES
   ========================================================================= */
function startTimer(n, u) {
  n = Number(n);
  if (!isFinite(n) || n <= 0) return 'El tiempo debe ser mayor que cero.';
  let ms = n * 1000;
  if (u.startsWith('min')) ms = n * 60000;
  if (u.startsWith('hora')) ms = n * 3600000;
  if (ms > 7 * 24 * 3600000) return 'El temporizador admite hasta 7 días.';

  const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const timer = setTimeout(() => {
    STATE.timers.delete(id);
    agregarMensaje('⏰ ' + STATE.nombreUsuario + apeFin() + ', terminó el temporizador de ' + n + ' ' + u + '.', 'sistema');
    hablar('Atención. Terminó el temporizador de ' + n + ' ' + u + '.');
  }, ms);

  STATE.timers.set(id, timer);
  return fraseJarvis() + ' Temporizador activado por ' + n + ' ' + u + '. Le avisaré cuando termine.';
}

function limpiarTimers() {
  for (const t of STATE.timers.values()) clearTimeout(t);
  STATE.timers.clear();
}

function countdown(sec) {
  if (!Number.isSafeInteger(sec) || sec < 1 || sec > 86400) return 'La cuenta atrás admite entre 1 segundo y 24 horas.';
  let rest = sec;
  agregarMensaje('Cuenta atrás iniciada: ' + sec + ' segundos.', 'sistema');
  const id = setInterval(() => {
    rest -= 1;
    if (rest <= 0) {
      clearInterval(id);
      STATE.timers.delete(id);
      agregarMensaje('⏰ ¡Cuenta atrás terminada!', 'sistema');
      hablar('La cuenta atrás terminó.');
    }
  }, 1000);
  STATE.timers.set(id, id);
  return fraseJarvis() + ' Cuenta atrás desde ' + sec + ' segundos.';
}

/* =========================================================================

function procesarComando(textoOriginal) {
  const texto = String(textoOriginal || '').trim();
  const t = norm(texto);
  const plano = texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();

  if (!t) return { manejado: true, respuesta: 'Escribí un mensaje para comenzar.' };

  /* ========== 1. PERSONALIZACIÓN ========== */
  const pers = procesarPersonalizacion(texto);
  if (pers) return { manejado: true, respuesta: pers };

  /* ========== 2. SALUDO A PERSONA ========== */
  const saludo = procesarSaludo(texto);
  if (saludo) return { manejado: true, respuesta: saludo };

  /* ========== 3. CAMBIO DE COLOR DEL REACTOR ========== */
  const esColorCmd = /(cambia|cambiar|pon|poner|pinta|coloca|quiero|haz|hace|modifica|vuelve|setea|aplica)\s+(?:el\s+|la\s+)?(?:reactor|nucleo|núcleo|color|tema|fondo|interfaz|ui|luces)\s+(?:a|en|de|al|para|color)\s+(?:color\s+)?(.+)/i.test(texto)
    || /(?:reactor|nucleo|núcleo|color|tema)\s+(?:en\s+|de\s+|a\s+|color\s+)([a-záéíóúñ]{3,})/i.test(texto)
    || /(?:color|tema)\s+(?:a\s+)?([a-záéíóúñ]{3,})\s+(?:para\s+)?(?:el\s+)?(?:reactor|nucleo|núcleo)/i.test(texto)
    || /pon(?:e|é|le)?\s+(?:el\s+)?reactor\s+(?:de\s+color\s+)?(.+)/i.test(texto);

  if (esColorCmd) {
    // Extraer el color mencionado
    let colorTexto = null;
    let m = texto.match(/(?:reactor|nucleo|núcleo|color|tema|fondo|interfaz|ui)\s+(?:a|en|de|al|para|color)\s+(?:color\s+)?([a-záéíóúñ]+)/i);
    if (m) colorTexto = m[1];
    if (!colorTexto) {
      m = texto.match(/([a-záéíóúñ]+)\s+(?:para\s+)?(?:el\s+)?(?:reactor|nucleo|núcleo)/i);
      if (m) colorTexto = m[1];
    }
    if (!colorTexto) {
      m = texto.match(/(?:reactor|nucleo|núcleo)\s+(?:en\s+|de\s+|a\s+|color\s+)([a-záéíóúñ]+)/i);
      if (m) colorTexto = m[1];
    }

    if (colorTexto) {
      // 1) Intentar hexadecimal directo
      if (/^#?[0-9a-f]{3}$|^#?[0-9a-f]{6}$/i.test(colorTexto)) {
        const hex = colorTexto.startsWith('#') ? colorTexto : '#' + colorTexto;
        if (aplicarColor(hex, colorTexto)) {
          return { manejado: true, respuesta: fraseJarvis() + ' Reactor ajustado al color personalizado ' + hex + '.' };
        }
      }
      // 2) Intentar color nombrado
      const hex = nombreAColor(colorTexto);
      if (hex) {
        aplicarColor(hex, colorTexto);
        return { manejado: true, respuesta: fraseJarvis() + ' He ajustado el reactor al color ' + colorTexto.toLowerCase() + '.' };
      }
      // 3) Intentar HSL (hue numérico)
      const hue = parseInt(colorTexto, 10);
      if (isFinite(hue) && hue >= 0 && hue <= 360) {
        const hexHsl = hslToHex(hue, 90, 65);
        aplicarColor(hexHsl, 'hue ' + hue);
        return { manejado: true, respuesta: fraseJarvis() + ' Reactor ajustado al tono ' + hue + ' grados.' };
      }
      // No reconocido
      return {
        manejado: true,
        respuesta: fraseJarvis() + ' No reconocí el color "' + colorTexto + '". Decime un nombre en español (rojo, azul, verde, dorado, morado, rosa, naranja, turquesa, lila, beige, marrón) o un hexadecimal como #ff00ff.'
      };
    }
    return {
      manejado: true,
      respuesta: fraseJarvis() + ' Decime el color al que querés que ajuste el reactor. Podés usar nombres en español o un código hexadecimal.'
    };
  }

  /* ========== 4. IDENTIDAD ========== */
  if (/\b(te llamas|tu nombre|como te llamas|quien eres|que eres|eres agus|tu identidad|presentate)\b/.test(t)) {
    return {
      manejado: true,
      respuesta: 'Soy AGUS, su asistente personal. Inspirado en el estilo de JARVIS: formal, eficiente y siempre a su servicio. Puedo abrir sitios, buscar en internet, cambiar el color de mi núcleo, hacer matemática avanzada, gestionar temporizadores, contar datos curiosos y, si me lo pedís, traducir cosas del inglés.'
    };
  }

  /* ========== 5. JARVIS CITA ========== */
  if (/\b(frase\s+de\s+jarvis|cita\s+de\s+jarvis|dime\s+algo\s+de\s+jarvis|frase\s+jarvis)\b/.test(t)) {

    return {

        '• "calcula 15% de 240"\n' +
        '• "raíz cuadrada de 144"\n' +

        '• "fibonacci 20"\n' +

        '• "factores primos de 120"\n' +

    return { manejado: true, respuesta: pick(PIROPOS) };

  if (/\b(reflexion|algo profundo|frase filosofica|pensamiento profundo)\b/.test(t))
    return { manejado: true, respuesta: pick(REFLEXIONES) };

  if (/\b(consejo|aconsejame|dame un consejo|recomendacion|que me recomendas)\b/.test(t))
    return { manejado: true, respuesta: pick(CONSEJOS) };

  if (/\b(motivame|motivacion|inspirame|dame fuerzas|algo motivador)\b/.test(t))
    return { manejado: true, respuesta: pick(MOTIVACIONES) };

  /* ========== 13. JUEGOS ========== */
  if (/\b(lanza una moneda|tira la moneda|cara o cruz|lanza la moneda)\b/.test(t)) {
    return { manejado: true, respuesta: 'Ha salido ' + (Math.random() < 0.5 ? 'cara' : 'cruz') + apeFin() + '.' };
  }

  m = t.match(/(?:lanza|tira)\s+(?:un\s+)?dado(?:\s+de\s+(\d+))?/);
  if (m) {
    const c = Math.max(2, Math.min(100, Number(m[1] || 6)));
    return { manejado: true, respuesta: 'Ha salido ' + (Math.floor(Math.random() * c) + 1) + ' en el dado de ' + c + ' caras.' };
  }

  m = t.match(/(?:piedra papel o tijera|juguemos piedra papel tijera|yo elijo)\s*(piedra|papel|tijera)?/);
  if (m) {
    const u = m[1];
    const b = pick(['piedra', 'papel', 'tijera']);
    if (!u) return { manejado: true, respuesta: 'Elijo ' + b + '. Para jugar, escribí "piedra", "papel" o "tijera".' };
    const r = u === b
      ? 'Empate'
      : ((u === 'piedra' && b === 'tijera') || (u === 'papel' && b === 'piedra') || (u === 'tijera' && b === 'papel'))
        ? 'Ha ganado usted'
        : 'Esta vez gano yo';
    return { manejado: true, respuesta: r + apeFin() + '. Usted eligió ' + u + ' y yo ' + b + '.' };
  }

  /* ========== 14. PANTALLA COMPLETA ========== */
  if (/\b(pantalla completa|activar pantalla completa|maximizar pantalla)\b/.test(t)) {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      return { manejado: true, respuesta: 'Activando pantalla completa' + apeFin() + '.' };
    }
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    return { manejado: true, respuesta: 'Saliendo de pantalla completa' + apeFin() + '.' };
  }

  /* ========== 15. TRADUCCIÓN ========== */
  m = texto.match(/(?:traduce|traduc[ií]|traduccion\s+de|traduceme|traducir)\s+(.+)/i);
  if (m && m[1].trim()) {
    return { manejado: true, respuesta: traducir(m[1].trim()), hablar: true };
  }

  // "cómo se dice X en inglés/español"
  m = texto.match(/(?:como\s+se\s+dice|c[oó]mo\s+se\s+dice)\s+(.+?)\s+en\s+(ingl[eé]s|espa[nñ]ol)/i);
  if (m) {
    const frase = m[1].trim();
    const idioma = /ingl/i.test(m[2]) ? 'en' : 'es';
    const otro = idioma === 'en' ? 'es' : 'en';
    const url = 'https://translate.google.com/?sl=' + otro + '&tl=' + idioma + '&text=' + encodeURIComponent(frase) + '&op=translate';
    abrirUrl(url, 'el traductor');
    return { manejado: true, respuesta: fraseJarvis() + ' Abro el traductor para "' + frase + '".' };
  }

  /* ========== 16. MATEMÁTICA ========== */
  const mat = procesarMate(texto);
  if (mat) return { manejado: true, respuesta: mat };

  /* ========== 17. "ABRE X Y BUSCA Y" ========== */
  m = plano.match(/^(?:por favor\s+)?(?:abre|abrir|abri|abreme|abrime|ve a|anda a|entra a|entrar a|accede a|visita|llevame a|quiero abrir|quiero que abras|puedes abrir|podes abrir|podrias abrir|necesito abrir|quiero entrar a)\s+(youtube|google|wikipedia|wiki|mercadolibre|mercado libre|spotify|github|amazon|netflix|twitch|reddit|stackoverflow|instagram|facebook|tiktok|twitter|x)\s+(?:y\s+|para\s+|a\s+)?(?:busca|buscar|buscame|pon|reproduce|encuentra|quiero ver|quiero escuchar|muestra|muestrame|mostrame)\s+(.+?)\s*$/i);
  if (m) {
    const sitio = m[1].toLowerCase();
    const consulta = m[3].trim();
    let url, label;

    if (/youtube/.test(sitio)) {
      url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(consulta);
      label = 'YouTube con la búsqueda "' + consulta + '"';
    } else if (/google/.test(sitio)) {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(consulta);
      label = 'Google con la búsqueda "' + consulta + '"';
    } else if (/wikipedia|wiki/.test(sitio)) {
      url = 'https://es.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(consulta);
      label = 'Wikipedia buscando "' + consulta + '"';
    } else if (/mercadolibre|mercado/.test(sitio)) {
      url = 'https://listado.mercadolibre.com.ar/' + encodeURIComponent(consulta);
      label = 'Mercado Libre buscando "' + consulta + '"';
    } else if (/spotify/.test(sitio)) {
      url = 'https://open.spotify.com/search/' + encodeURIComponent(consulta);
      label = 'Spotify buscando "' + consulta + '"';
    } else if (/github/.test(sitio)) {
      url = 'https://github.com/search?q=' + encodeURIComponent(consulta);
      label = 'GitHub buscando "' + consulta + '"';
    } else if (/amazon/.test(sitio)) {
      url = 'https://www.amazon.com/s?k=' + encodeURIComponent(consulta);
      label = 'Amazon buscando "' + consulta + '"';
    } else if (/netflix/.test(sitio)) {
      url = 'https://www.netflix.com/search?q=' + encodeURIComponent(consulta);
      label = 'Netflix buscando "' + consulta + '"';
    } else if (/twitch/.test(sitio)) {
      url = 'https://www.twitch.tv/search?term=' + encodeURIComponent(consulta);
      label = 'Twitch buscando "' + consulta + '"';
    } else if (/reddit/.test(sitio)) {
      url = 'https://www.reddit.com/search/?q=' + encodeURIComponent(consulta);
      label = 'Reddit buscando "' + consulta + '"';
    } else if (/stackoverflow/.test(sitio)) {
      url = 'https://es.stackoverflow.com/search?q=' + encodeURIComponent(consulta);
      label = 'Stack Overflow buscando "' + consulta + '"';
    } else if (/instagram/.test(sitio)) {
      url = 'https://www.instagram.com/explore/tags/' + encodeURIComponent(consulta.replace(/\s+/g, ''));
      label = 'Instagram buscando "' + consulta + '"';
    } else if (/facebook/.test(sitio)) {
      url = 'https://www.facebook.com/search/top?q=' + encodeURIComponent(consulta);
      label = 'Facebook buscando "' + consulta + '"';
    } else if (/tiktok/.test(sitio)) {
      url = 'https://www.tiktok.com/search?q=' + encodeURIComponent(consulta);
      label = 'TikTok buscando "' + consulta + '"';
    } else if (/twitter|x/.test(sitio)) {
      url = 'https://x.com/search?q=' + encodeURIComponent(consulta);
      label = 'X buscando "' + consulta + '"';
    } else {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(sitio + ' ' + consulta);
      label = sitio + ' buscando "' + consulta + '"';
    }

    abrirUrl(url, label);
    return { manejado: true, respuesta: fraseJarvis() + ' Abro ' + label + '.', hablar: false };
  }

  /* ========== 18. APERTURA SIMPLE DE SITIOS ========== */
  m = plano.match(/^(?:por favor\s+)?(?:abre|abrir|abri|abreme|abrime|ve a|anda a|entra a|entrar a|accede a|visita|llevame a|quiero abrir|quiero que abras|quiero que me abras|puedes abrir|podes abrir|podrias abrir|necesito abrir|necesito que abras|quiero entrar a|pon|ponme|lanza|inicia)\s+(.+?)\s*$/i);
  if (m) {
    const dest = m[1].replace(/\s+(?:por favor|ahora|rapido|rapidamente|ya mismo|ya)$/i, '').trim();
    const sitio = detectarSitio(dest);
    if (sitio) {
      abrirUrl(sitio.u || sitio.url, sitio.l || sitio.label);
      return { manejado: true, respuesta: fraseJarvis() + ' Abro ' + (sitio.l || sitio.label) + '.', hablar: false };
    }
    if (buscarEn(dest, 'google')) {
      return { manejado: true, respuesta: 'No tengo ese sitio en la lista. Busco "' + dest + '" en Google' + apeFin() + '.', hablar: false };
    }
  }

  /* ========== 19. YOUTUBE EXPLÍCITO ========== */
  m = plano.match(/^(?:busca|buscar|buscame|pon|reproduce|encuentra|quiero ver|quiero escuchar|poneme|reproducí|reproduci)\s+(?:en\s+)?youtube\s+(.+)$/i);
  if (m && m[1].trim()) {
    buscarEn(m[1].trim(), 'youtube');
    return { manejado: true, respuesta: fraseJarvis() + ' Abro YouTube con la búsqueda "' + m[1].trim() + '".', hablar: false };
  }

  m = plano.match(/^(?:busca|pon|reproduce|quiero ver|mostrame|muestrame)\s+(?:el\s+)?(?:video|clip)\s+(?:de\s+)?(.+)$/i);
  if (m && m[1].trim()) {
    buscarEn(m[1].trim(), 'youtube');
    return { manejado: true, respuesta: 'Abro YouTube para encontrar videos de "' + m[1].trim() + '"' + apeFin() + '.', hablar: false };
  }

  m = plano.match(/^(?:pon|reproduce|quiero escuchar|quiero oir|poneme)\s+(?:la\s+)?(?:cancion|musica|tema|album)\s+(?:de\s+)?(.+)$/i);
  if (m && m[1].trim()) {
    const q = 'música ' + m[1].trim();
    buscarEn(q, 'youtube');
    return { manejado: true, respuesta: 'Abro YouTube para buscar "' + q + '"' + apeFin() + '.', hablar: false };
  }

  /* ========== 20. BÚSQUEDA GOOGLE ========== */
  m = plano.match(/^(?:busca|buscar|buscame|googlea|encuentra|investiga)\s+(?:en google\s+|en internet\s+|en la web\s+)?(.+)$/i);
  if (m && m[1].trim()) {
    buscarEn(m[1].trim(), 'google');
    return { manejado: true, respuesta: 'Abro Google para buscar "' + m[1].trim() + '"' + apeFin() + '.', hablar: false };
  }

  if (/^(?:pon|reproduce|quiero escuchar|quiero oir)\s+(?:musica|una cancion)\b/.test(t)) {
    buscarEn('lofi hip hop radio música relajante', 'youtube');
    return { manejado: true, respuesta: 'Abro YouTube con música relajante' + apeFin() + '.', hablar: false };
  }

  return null;
}

/* =========================================================================
   MANEJADOR PRINCIPAL
   ========================================================================= */
function manejarEntrada(texto) {
  texto = String(texto || '').trim();
  if (!texto) return;

  agregarMensaje(texto, 'usuario');

  const resultado = procesarComando(texto);
  if (resultado && resultado.manejado) {
    responder(resultado.respuesta, resultado.hablar);
    return;
  }

  // Fallback: buscar en Google lo que no reconoció
  const limpio = texto.replace(/^(?:agus|por favor)[,\s]+/i, '').trim();
  if (limpio.length > 2 && limpio.length < 200) {
    buscarEn(limpio, 'google');
    responder('No tengo ese comando registrado, así que busco "' + limpio + '" en Google' + apeFin() + '.', false);
  } else {
    responder('No pude interpretar eso. Podés decirme "ayuda" para ver todo lo que sé hacer.');
  }
}

/* =========================================================================
   RECONOCIMIENTO DE VOZ
   ========================================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  const rec = new SR();
  rec.lang = 'es-AR';
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    STATE.escuchando = true;
    DOM.btnMic.classList.add('on');
    DOM.body.classList.add('escuchando');
    setEstado('Escuchando', 'habla');
  };

  rec.onresult = (e) => {
    const r = e.results && e.results[e.results.length - 1] && e.results[e.results.length - 1][0] && e.results[e.results.length - 1][0].transcript;
    if (r) manejarEntrada(r);
  };

  rec.onerror = (e) => {
    const msg = e.error === 'not-allowed'
      ? 'El navegador bloqueó el micrófono. Revisá los permisos del sitio.'
      : e.error === 'no-speech'
        ? 'No detecté voz. Pulsá el micrófono e intentá otra vez.'
        : 'No se pudo usar el micrófono (' + (e.error || 'error') + ').';
    agregarMensaje(msg, 'sistema');
  };

  rec.onend = () => {
    STATE.escuchando = false;
    DOM.btnMic.classList.remove('on');
    DOM.body.classList.remove('escuchando');
    setEstado('Listo', 'vivo');
  };

  STATE.reconocedor = rec;
}

DOM.btnMic.addEventListener('click', () => {
  if (!STATE.reconocedor) {
    agregarMensaje('Este navegador no ofrece reconocimiento de voz. Probá Chrome, Edge o Safari actualizado.', 'sistema');
    return;
  }
  if (STATE.escuchando) {
    try { STATE.reconocedor.stop(); } catch (_) {}
    return;
  }
  try {
    if (STATE.synth) STATE.synth.cancel();
    STATE.reconocedor.start();
  } catch (_) {
    agregarMensaje('No pude iniciar el micrófono. Esperá un momento y volvé a intentarlo.', 'sistema');
  }
});

/* =========================================================================
   EVENTOS DE UI
   ========================================================================= */
DOM.formulario.addEventListener('submit', (e) => {
  e.preventDefault();
  const v = DOM.entrada.value;
  DOM.entrada.value = '';
  manejarEntrada(v);
});

$$('.chip').forEach(c => {
  c.addEventListener('click', () => manejarEntrada(c.dataset.cmd || c.textContent.trim()));
});

DOM.btnVoz.addEventListener('click', () => {
  STATE.vozActiva = !STATE.vozActiva;
  DOM.btnVoz.textContent = STATE.vozActiva ? '🔊' : '🔇';
  DOM.btnVoz.classList.toggle('on', STATE.vozActiva);
  try { localStorage.setItem('agus_voz', String(STATE.vozActiva)); } catch (_) {}
  if (!STATE.vozActiva && STATE.synth) STATE.synth.cancel();
  agregarMensaje(STATE.vozActiva ? 'Voz activada. Usaré una voz masculina en español.' : 'Voz silenciada.', 'sistema');
});

DOM.btnLimpiar.addEventListener('click', () => {
  DOM.mensajes.replaceChildren();
  STATE.historial = [];
  agregarMensaje('Conversación limpia. Listo para ayudarle' + apeFin() + '.', 'sistema');
});

/* =========================================================================
   ARRANQUE
   ========================================================================= */
const PASOS = [
  'Inicializando núcleo…',
  'Calibrando sensores de voz…',
  'Verificando voz masculina en español…',
  'Cargando protocolos de asistencia…',
  'Sistemas listos.'
];

function ejecutarArranque() {
  let i = 0;
  const int = setInterval(() => {
    if (i < PASOS.length) {
      DOM.arranqueTexto.textContent = PASOS[i];
      i++;
    } else {
      clearInterval(int);
    }
  }, 320);
}

ejecutarArranque();

window.addEventListener('load', () => {
  // Aplicar color guardado
  aplicarColor(STATE.colorHex, STATE.colorNombre);

  // Ajustar botón de voz
  DOM.btnVoz.textContent = STATE.vozActiva ? '🔊' : '🔇';
  DOM.btnVoz.classList.toggle('on', STATE.vozActiva);

  // Ocultar arranque
  setTimeout(() => {
    DOM.arranque.classList.add('oculto');

    // Mensaje de bienvenida
    const saludo = 'Buenas' + apeFin() + '. Soy AGUS, su asistente personal. A su entera disposición. Puedo abrir sitios, buscar en YouTube y Google, cambiar el color de mi núcleo, hacer matemática avanzada, traducir del inglés y mucho más. Dígame qué necesita.';
    agregarMensaje(saludo, 'agus');

    // Voz de bienvenida (con pequeño delay para que arranque bien)
    setTimeout(() => hablar('Buenas' + apeFin() + '. Soy AGUS, su asistente personal. A su entera disposición. Dígame qué necesita.'), 600);
  }, 1800);

  // Reintentar cargar voces por si tardan
  setTimeout(cargarVoces, 2500);
});

/* Reanudar voz si el navegador la pausa */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && STATE.synth && STATE.synth.paused) {
    try { STATE.synth.resume(); } catch (_) {}
  }
});

/* Desbloquear síntesis en móviles con primer toque */
function desbloquearVoz() {
  if (STATE.synth) {
    try {
      STATE.synth.getVoices();
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      STATE.synth.speak(u);
    } catch (_) {}
  }
  document.removeEventListener('touchstart', desbloquearVoz);
  document.removeEventListener('click', desbloquearVoz);
}
document.addEventListener('touchstart', desbloquearVoz, { once: true, passive: true });
document.addEventListener('click', desbloquearVoz, { once: true });

/* =========================================================================
   FIN
   ========================================================================= */
</script>
</body>
