<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b13">
<title>AGUS · Asistente personal</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#050b13;
    --panel:#0a1727;
    --cyan:#48e4ff;
    --cyan-soft:rgba(72,228,255,.14);
    --border:rgba(72,228,255,.22);
    --text:#e4f7ff;
    --muted:#7f9cae;
    --ok:#56f0b0;
    --warn:#ffbd70;
    --radius:14px;
  }
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{
    background:radial-gradient(ellipse at 50% 0%,#0e2b44 0%,#050b13 60%);
    position:fixed;
    inset:0;
  }

  /* ---------- LAYOUT PRINCIPAL ---------- */
  .app{
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    height:100dvh;
    height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:rgba(4,12,22,.85);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    gap:8px;
    min-width:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    flex:1;
  }
  .logo{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid var(--cyan);
    box-shadow:0 0 10px rgba(72,228,255,.5);
    position:relative;
    flex-shrink:0;
  }
  .logo::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:var(--cyan);
    animation:pulse 2s infinite;
  }
  h1{
    font-size:14px;
    letter-spacing:2.5px;
    color:#fff;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .btn{
    background:var(--cyan-soft);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:7px 10px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    min-height:34px;
    display:inline-flex;
    align-items:center;
    gap:4px;
    transition:background .15s;
  }
  .btn:active{background:rgba(72,228,255,.25)}

  /* ---------- REACTOR COMPACTO ---------- */
  .reactor-bar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:rgba(8,20,34,.6);
    border-bottom:1px solid var(--border);
  }
  .reactor{
    width:44px;
    height:44px;
    position:relative;
    flex-shrink:0;
    display:grid;
    place-items:center;
  }
  .ring{
    position:absolute;
    border:1px solid var(--border);
    border-radius:50%;
  }
  .r1{
    inset:0;
    border-top-color:var(--cyan);
    border-bottom-color:var(--cyan);
    animation:spin 8s linear infinite;
  }
  .r2{
    inset:6px;
    border-left-color:var(--cyan);
    border-right-color:var(--cyan);
    animation:spin 5s linear infinite reverse;
  }
  .core{
    width:18px;
    height:18px;
    border-radius:50%;
    background:radial-gradient(circle,#fff,var(--cyan) 60%,transparent);
    box-shadow:0 0 18px var(--cyan);
    animation:pulse 2.5s infinite;
  }
  body.speaking .core{
    background:radial-gradient(circle,#fff,var(--warn) 60%,transparent);
    box-shadow:0 0 18px var(--warn);
    animation:pulse .6s infinite;
  }
  body.listening .core{
    background:radial-gradient(circle,#fff,var(--ok) 60%,transparent);
    box-shadow:0 0 18px var(--ok);
  }
  .reactor-info{
    flex:1;
    min-width:0;
  }
  .status-line{
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .state-line{
    font-size:13px;
    color:#fff;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .voice-select{
    background:#091725;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:6px 8px;
    font-size:11px;
    max-width:110px;
    flex-shrink:0;
    font-family:inherit;
  }

  /* ---------- CHAT ---------- */
  .chat{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    min-height:0;
    background:rgba(8,20,34,.4);
  }
  .messages{
    flex:1;
    overflow-y:auto;
    padding:12px 12px 8px;
    display:flex;
    flex-direction:column;
    gap:10px;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
  }
  .msg{
    max-width:88%;
    padding:10px 13px;
    border-radius:14px;
    font-size:14px;
    line-height:1.5;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
    animation:fade .2s ease;
  }
  .msg.bot{
    align-self:flex-start;
    background:rgba(72,228,255,.08);
    border:1px solid var(--border);
    border-left:3px solid var(--cyan);
    border-radius:4px 14px 14px 14px;
    color:#dff7ff;
  }
  .msg.user{
    align-self:flex-end;
    background:rgba(72,228,255,.16);
    border:1px solid rgba(72,228,255,.4);
    border-radius:14px 4px 14px 14px;
    color:#fff;
  }
  .msg.system{
    align-self:center;
    background:rgba(255,189,112,.08);
    border:1px solid rgba(255,189,112,.3);
    color:#ffd9ae;
    font-size:11px;
    padding:6px 12px;
    border-radius:20px;
    max-width:92%;
    text-align:center;
  }
  .msg.action{
    align-self:center;
    background:rgba(72,228,255,.1);
    border:1px solid var(--border);
    color:#cfeef8;
    font-size:11px;
    padding:6px 12px;
    border-radius:20px;
    text-align:center;
  }
  .msg a{color:var(--cyan);text-decoration:underline}
  .msg .src{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--border);
    font-size:11px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .msg .src b{color:var(--muted);font-weight:600}
  .typing{
    display:flex;
    gap:4px;
    padding:12px 14px;
    align-self:flex-start;
    background:rgba(72,228,255,.08);
    border:1px solid var(--border);
    border-radius:4px 14px 14px 14px;
  }
  .typing i{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--cyan);
    animation:blink 1s infinite;
  }
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}

  /* ---------- CHIPS + INPUT ---------- */
  .chips{
    display:flex;
    gap:6px;
    padding:8px 10px;
    overflow-x:auto;
    scrollbar-width:none;
    border-top:1px solid var(--border);
    background:rgba(3,10,18,.6);
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;
    padding:7px 12px;
    border:1px solid var(--border);
    background:var(--cyan-soft);
    color:#cfeef8;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    min-height:32px;
  }
  .chip:active{background:rgba(72,228,255,.25)}

  form{
    display:flex;
    gap:8px;
    align-items:flex-end;
    padding:10px;
    background:rgba(3,10,18,.85);
    border-top:1px solid var(--border);
  }
  .mic,.send{
    width:44px;
    height:44px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--cyan-soft);
    color:var(--cyan);
    font-size:18px;
    cursor:pointer;
    display:grid;
    place-items:center;
    flex-shrink:0;
    font-family:inherit;
  }
  .mic.on{
    background:var(--ok);
    color:#04251a;
    border-color:var(--ok);
    animation:pulse 1s infinite;
  }
  .send{
    background:var(--cyan);
    color:#04141c;
    border-color:var(--cyan);
  }
  input[type=text]{
    flex:1;
    min-width:0;
    min-height:44px;
    padding:11px 14px;
    background:rgba(0,0,0,.3);
    border:1px solid var(--border);
    border-radius:12px;
    color:#eefbff;
    font-size:16px;
    font-family:inherit;
    outline:none;
  }
  input[type=text]:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(72,228,255,.1);
  }
  input[type=text]::placeholder{color:#557080}

  /* ---------- BOOT ---------- */
  .boot{
    position:fixed;
    inset:0;
    z-index:100;
    background:#040a12;
    display:grid;
    place-items:center;
    gap:14px;
    transition:opacity .4s,visibility .4s;
  }
  .boot.hide{opacity:0;visibility:hidden;pointer-events:none}
  .boot-orb{
    width:70px;
    height:70px;
    border-radius:50%;
    background:radial-gradient(circle,#fff,var(--cyan) 55%,transparent);
    box-shadow:0 0 60px var(--cyan);
    animation:pulse 1.3s infinite;
  }
  .boot-name{
    color:#fff;
    letter-spacing:8px;
    font-size:20px;
    font-weight:700;
  }
  .boot-cap{
    color:var(--muted);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .boot-wrap{display:grid;place-items:center;gap:14px}

  /* ---------- ANIMACIONES ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- ESCRITORIO (pantalla ancha) ---------- */
  @media(min-width:900px){
    .app{
      grid-template-columns:340px 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:
        "header header"
        "side chat";
    }
    header{grid-area:header;padding:12px 24px}
    .reactor-bar{
      grid-area:side;
      flex-direction:column;
      justify-content:flex-start;
      padding:24px;
      gap:20px;
      border-right:1px solid var(--border);
      border-bottom:none;
      background:rgba(8,20,34,.5);
    }
    .reactor{width:140px;height:140px}
    .core{width:56px;height:56px}
    .r2{inset:18px}
    .reactor-info{text-align:center;width:100%}
    .state-line{font-size:16px}
    .voice-select{max-width:none;width:100%}
    .chat{grid-area:chat}
    h1{font-size:18px;letter-spacing:6px}
    .logo{width:36px;height:36px}
    .btn{padding:8px 14px;font-size:13px}
  }
</style>
</head>
<body>

<div class="boot" id="boot">
  <div class="boot-wrap">
    <div class="boot-orb"></div>
    <div class="boot-name">AGUS</div>
    <div class="boot-cap">Inicializando</div>
  </div>
</div>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <h1>AGUS</h1>
    </div>
    <div class="actions">
      <button class="btn" id="btnAudio" type="button">🔊</button>
      <button class="btn" id="btnClear" type="button">Limpiar</button>
    </div>
  </header>

  <div class="reactor-bar">
    <div class="reactor" aria-hidden="true">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="core"></div>
    </div>
    <div class="reactor-info">
      <div class="status-line" id="statusText">A SU SERVICIO</div>
      <div class="state-line" id="stateText">Listo para ayudarte</div>
    </div>
    <select class="voice-select" id="voiceSelect" aria-label="Elegir voz">
      <option value="">Voz…</option>
    </select>
  </div>

  <section class="chat">
    <div class="messages" id="messages" role="log" aria-live="polite"></div>

    <div class="chips">
      <button class="chip" type="button" data-cmd="abre youtube">▶ YouTube</button>
      <button class="chip" type="button" data-cmd="abre google">⌕ Google</button>
      <button class="chip" type="button" data-cmd="cambia el reactor a rojo">🔴 Rojo</button>
      <button class="chip" type="button" data-cmd="cambia el reactor a dorado">🟡 Dorado</button>
      <button class="chip" type="button" data-cmd="calcula 15% de 240">∑ 15% de 240</button>
      <button class="chip" type="button" data-cmd="qué hora es">◷ Hora</button>
      <button class="chip" type="button" data-cmd="ayuda">? Ayuda</button>
    </div>

    <form id="form" autocomplete="off">
      <button class="mic" id="btnMic" type="button" title="Hablar">🎙</button>
      <input id="input" type="text" maxlength="10000" placeholder="Decime qué necesitás…" autocomplete="off">
      <button class="send" type="submit" title="Enviar">➤</button>
    </form>
  </section>
</div>

<script>
'use strict';

/* ============================================================
   AGUS v10 · mobile-first · JARVIS personality
   ============================================================ */

const $ = s => document.querySelector(s);
const body = document.body;
const messagesEl = $('#messages');
const inputEl = $('#input');
const formEl = $('#form');
const micBtn = $('#btnMic');
const audioBtn = $('#btnAudio');
const clearBtn = $('#btnClear');
const statusEl = $('#statusText');
const stateEl = $('#stateText');
const voiceSelect = $('#voiceSelect');

/* ---------- estado ---------- */
const S = {
  nombre: 'José',
  apelativo: 'Señor',
  color: 'cyan',
  voice: true,
  aiOk: false,
  model: '',
  hist: [],
  maxHist: 14,
  timers: new Map(),
  synth: window.speechSynthesis || null,
  voz: null,
  conv: []
};

try {
  const n = localStorage.getItem('agus_n');
  if (n) S.nombre = n;
  const a = localStorage.getItem('agus_a');
  if (a !== null) S.apelativo = a;
  const c = localStorage.getItem('agus_c');
  if (c) S.color = c;
  S.voice = localStorage.getItem('agus_v') !== '0';
} catch (_) {}

function save() {
  try {
    localStorage.setItem('agus_n', S.nombre);
    localStorage.setItem('agus_a', S.apelativo);
    localStorage.setItem('agus_c', S.color);
    localStorage.setItem('agus_v', S.voice ? '1' : '0');
  } catch (_) {}
}

/* ---------- colores ---------- */
const COL = {
  cyan:   { h:'#48e4ff', n:'cyan',    a:['cyan','celeste','turquesa','original','defecto','azul claro'] },
  rojo:   { h:'#ff4d5e', n:'rojo',    a:['rojo','red','escarlata'] },
  verde:  { h:'#56f0b0', n:'verde',   a:['verde','green','esmeralda'] },
  dorado: { h:'#ffb84d', n:'dorado',  a:['dorado','gold','oro','amarillo'] },
  morado: { h:'#b78bff', n:'morado',  a:['morado','purple','violeta','lila'] },
  rosa:   { h:'#ff7ec8', n:'rosa',    a:['rosa','pink','fucsia'] },
  naranja:{ h:'#ff8f4d', n:'naranja', a:['naranja','orange'] },
  azul:   { h:'#4d7eff', n:'azul',    a:['azul','blue'] },
  blanco: { h:'#eef6ff', n:'blanco',  a:['blanco','white'] },
  carmesi:{ h:'#dc143c', n:'carmesí', a:['carmesí','carmesi','crimson'] }
};

function hex2rgba(h,a){
  const x = h.replace('#','');
  const r = parseInt(x.substr(0,2),16);
  const g = parseInt(x.substr(2,2),16);
  const b = parseInt(x.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function aplicarColor(k){
  const c = COL[k] || COL.cyan;
  const r = document.documentElement.style;
  r.setProperty('--cyan', c.h);
  r.setProperty('--cyan-soft', hex2rgba(c.h, .14));
  r.setProperty('--border', hex2rgba(c.h, .22));
  body.style.background = `radial-gradient(ellipse at 50% 0%, ${hex2rgba(c.h,.08)} 0%, #050b13 60%)`;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', c.h);
  S.color = k;
  save();
}
function detectarColor(t){
  const n = norm(t);
  for (const k in COL){
    for (const al of COL[k].a){
      if (new RegExp(`\\b${al}\\b`).test(n)) return k;
    }
  }
  return null;
}

/* ---------- sitios ---------- */
const SITIOS = [
  {k:['youtube music','yt music'],u:'https://music.youtube.com',l:'YouTube Music'},
  {k:['chatgpt','chat gpt','gpt'],u:'https://chatgpt.com',l:'ChatGPT'},
  {k:['claude'],u:'https://claude.ai',l:'Claude'},

  {k:['twitch'],u:'https://www.twitch.tv',l:'Twitch'},

  {k:['drive'],u:'https://drive.google.com',l:'Google Drive'},

];
const SITIOS_F = SITIOS.flatMap(s => s.k.map(k => ({k, s}))).sort((a,b)=>b.k.length-a.k.length);

/* ---------- frases ---------- */
const FRASES = [
  'Para usted, siempre, {ape}.',
  'A su servicio, {ape}.',
  'Trabajando en ello, {ape}.',
  'Entendido, {ape}. Procediendo.',
  'Un placer ser de utilidad, {ape}.',
  'Considerelo hecho, {ape}.',
  'En marcha, {ape}.',
  'Ejecutando, {ape}.',
  'A la orden, {ape}.',
  'Sus deseos son mi directiva, {ape}.',
  'Un placer asistirle, {ape}.',
  'Procediendo con precisión, {ape}.',
  'Considere el asunto resuelto, {ape}.',
  'A su entera disposición, {ape}.',
  'Como usted diga, {ape}.'
];
function jv(f){ return f.replace(/\{ape\}/g, S.apelativo ? ', ' + S.apelativo : ''); }
function fraseJ(){ return jv(pick(FRASES)); }

const CHISTES = [
  '¿Por qué los programadores usan modo oscuro? Porque la luz atrae a los bugs.',
  '¿Qué le dijo el cero al ocho? ¡Qué buen cinturón!',
  'Hay 10 tipos de personas: las que entienden binario y las que no.',
  '¿Cómo se despiden dos programadores? Hasta el próximo commit.',
  'Un byte entra a un bar y pide un bit. El camarero dice: "mínimo una palabra".',
  'Estoy leyendo un libro sobre recursividad. Estoy leyendo un libro sobre recursividad.',
  'Mi código no tiene errores: tiene funciones sorpresa.',

const FEM = /(female|woman|mujer|femenina|helena|paulina|sabina|elvira|estrella|ximena|monica|mónica|lucia|lucía|maria|maría|carmen|laura|sofia|sofía|isabel|esperanza|dalia|valentina|jessica|jennifer|kate|samantha|zira|cortana|victoria|karen|susan|allison|ava|emma|mia|elena|natalia|claudia|camila|andrea|lola|lorena|patricia|silvia|rosa|marta|ana|cristina|beatriz|nuria|pilar|raquel)/i;
const MAS = /(tristan|trístan|arnau|dario|darío|elias|elías|saul|saúl|teo|alvaro|álvaro|jorge|pablo|raul|raúl|diego|carlos|david|daniel|miguel|luis|sergio|antonio|juan|andres|andrés|enrique|hector|héctor|bruno|nicolas|nicolás|tomas|tomás|davefx|carlfm|male|masculino|hombre)/i;
const esF = v => FEM.test(v?.name || '');
const esM = v => MAS.test(v?.name || '');

function cargarVoces(){
  if (!S.synth) return;
  const vs = S.synth.getVoices() || [];
  if (!vs.length) return;
  const es = vs.filter(v => /^es([-_]|$)/i.test(v.lang));
  let cand = es.filter(v => esM(v) && !esF(v));
  if (!cand.length) cand = es.filter(v => !esF(v));
  if (!cand.length) cand = vs.filter(v => esM(v) && !esF(v));
  if (!cand.length) cand = es.length ? es : vs;
  let ult = '';
  try { ult = localStorage.getItem('agus_voz') || ''; } catch(_){}
  voiceSelect.innerHTML = '<option value="">Voz…</option>';
  cand.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name.slice(0, 22);
    voiceSelect.appendChild(o);
  });
  S.voz = cand.find(v => v.voiceURI === ult) || cand[0] || null;
  voiceSelect.value = S.voz ? S.voz.voiceURI : '';
}
if (S.synth){
  cargarVoces();
  if (typeof S.synth.addEventListener === 'function') S.synth.addEventListener('voiceschanged', cargarVoces);
  S.synth.onvoiceschanged = cargarVoces;
  setTimeout(cargarVoces, 400);
  setTimeout(cargarVoces, 1500);
}

voiceSelect.addEventListener('change', () => {
  const vs = S.synth ? S.synth.getVoices() : [];
  const v = vs.find(x => x.voiceURI === voiceSelect.value);
  if (v && !esF(v)){
    S.voz = v;
    try { localStorage.setItem('agus_voz', voiceSelect.value); } catch(_){}
  }
});

audioBtn.textContent = S.voice ? '🔊' : '🔇';

function hablar(txt){
  if (!S.voice || !S.synth || !S.voz) return;
  try {
    S.synth.cancel();
    const t = String(txt).replace(/https?:\/\/\S+/g,'enlace').replace(/[`*_#>|]/g,'').replace(/\n+/g,'. ').slice(0, 2400);
    const u = new SpeechSynthesisUtterance(t);
    u.voice = S.voz;
    u.lang = S.voz.lang || 'es-AR';
    u.rate = 1;
    u.pitch = 0.72;
    u.volume = 1;
    u.onstart = () => body.classList.add('speaking');
    u.onend = u.onerror = () => body.classList.remove('speaking');
    S.synth.speak(u);
  } catch(_){}
}

/* ---------- abrir URLs ---------- */
function abrir(url, label){
  let v;
  try { v = new URL(url); } catch(_) { return false; }
  if (!['http:','https:'].includes(v.protocol)) return false;
  let w = null;
  try { w = window.open(v.href, '_blank'); if (w) w.opener = null; } catch(_){ w = null; }
  addAction(w ? 'Abriendo ' + label + '.' : 'El navegador bloqueó ' + label + '. Manual:', v.href);
  return true;
}
function buscar(q, donde){
  q = String(q||'').trim();
  if (!q) return false;
  const url = donde === 'youtube'
    ? 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q)
    : 'https://www.google.com/search?q=' + encodeURIComponent(q);
  return abrir(url, donde === 'youtube' ? 'la búsqueda en YouTube' : 'la búsqueda en Google');
}
function detectarSitio(dest){
  let v = norm(dest).replace(/\b(ahora|rapido|por favor|ya)\b/g,'').trim();
  v = v.replace(/^(la pagina de |pagina de |el sitio de |sitio de |la web de |web de |la app de |app de )/, '').trim();
  for (const e of SITIOS_F){
    const c = norm(e.k);
    if (v === c || v === 'www ' + c || v.startsWith(c + ' ')) return e.s;
  }
  const h = String(dest||'').trim().replace(/[.,!?]+$/,'');
  if (/^https?:\/\//i.test(h)){
    try {
      const u = new URL(h);
      if (u.hostname.includes('.') && !u.username && !u.password) return {u: u.href, l: u.hostname};
    } catch(_){}
  }
  if (/^(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?$/i.test(h)){
    try {
      const u = new URL('https://' + h.replace(/^https?:\/\//i,''));
      if (!u.username && !u.password) return {u: u.href, l: u.hostname};
    } catch(_){}
  }
  return null;
}

/* ---------- matemática ---------- */
const ME = (() => {
  const PI = Math.PI, E = Math.E;
  function limpiar(s){
    s = String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    s = s.replace(/^(?:por favor\s+)?(?:calcula(?:me)?|cuanto es|cuanto da|resuelve|resultado de)\s+/i,'');
    s = s.replace(/[×✕]/g,'*').replace(/[÷]/g,'/').replace(/\^\^/g,'^').replace(/\*\*/g,'^');
    s = s.replace(/raiz cuadrada de\s*\(?\s*([0-9.]+)\s*\)?/g,'sqrt($1)');
    s = s.replace(/raiz de\s*\(?\s*([0-9.]+)\s*\)?/g,'sqrt($1)');
    s = s.replace(/([0-9.]+)\s+al cuadrado/g,'($1)^2');
    s = s.replace(/([0-9.]+)\s+al cubo/g,'($1)^3');
    s = s.replace(/\belevado a\b/g,'^').replace(/\bdividido (?:por|entre)\b/g,'/').replace(/\bentre\b/g,'/').replace(/\bpor\b/g,'*').replace(/\bmas\b/g,'+').replace(/\bmenos\b/g,'-');
    s = s.replace(/,\s*/g,'.').replace(/\s+/g,'');
    return s;
  }
  function eval_(expr){
    try {
      const s = limpiar(expr);
      if (!s) return null;
      const tks = s.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[a-z]+|[()+\-*/%^!]/g);
      if (!tks || !tks.length) return null;
      if (tks.join('') !== s) return null;
      const fn = {sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log10,ln:Math.log,exp:Math.exp};
      function fact(n){ if (!Number.isInteger(n)||n<0||n>170) throw 0; let r = 1; for (let i=2;i<=n;i++) r*=i; return r; }
      let i = 0;
      const peek = () => tks[i], take = () => tks[i++];
      function prim(){
        const t = take();
        if (t === undefined) throw 0;
        if (t === '('){ const v = ex(); if (take() !== ')') throw 0; return v; }
        if (/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/.test(t)) return parseFloat(t);
        if (t === 'pi') return PI;
        if (t === 'e') return E;
        if (fn[t]){ let a; if (peek()==='('){ take(); a = ex(); if (take() !== ')') throw 0; } else a = un(); return fn[t](a); }
        throw 0;
      }
      function post(){ let v = prim(); while (peek() === '!'){ take(); v = fact(v); } return v; }
      function pow(){ const b = post(); if (peek() === '^'){ take(); return b ** un(); } return b; }
      function un(){ if (peek() === '+'){ take(); return un(); } if (peek() === '-'){ take(); return -un(); } return pow(); }
      function tm(){
        let v = un();
        while (['*','/','%'].includes(peek())){
          const o = take(), r = un();
          if ((o==='/'||o==='%') && r===0) throw 0;
          if (o==='*') v *= r; if (o==='/') v /= r; if (o==='%') v %= r;
        }
        return v;
      }
      function ex(){
        let v = tm();
        while (peek() === '+' || peek() === '-'){
          const o = take(), r = tm();
          v = o==='+' ? v+r : v-r;
        }
        return v;
      }
      const r = ex();
      if (i !== tks.length || !Number.isFinite(r)) return null;
      return Math.abs(r) < 1e-12 ? 0 : Number(r.toPrecision(12));
    } catch(_){ return null; }
  }
  function primo(n){
    n = Math.floor(n);
    if (n < 2) return false;
    if (n < 4) return true;
    if (n % 2 === 0) return false;
    const l = Math.floor(Math.sqrt(n));
    for (let i=3;i<=l;i+=2) if (n%i===0) return false;
    return true;
  }
  function factores(n){
    n = Math.floor(n);
    if (n < 2) return [];
    const r = []; let d = 2;
    while (n > 1){
      while (n%d===0){ r.push(d); n/=d; }
      d++;
      if (d*d>n && n>1){ r.push(n); break; }
    }
    return r;
  }
  function fib(n){
    n = Math.floor(n);
    if (n<0||n>100) return null;
    if (n===0) return 0;
    if (n===1) return 1;
    let a=0,b=1,c;
    for (let i=2;i<=n;i++){ c=a+b; a=b; b=c; }
    return b;
  }
  function mcd(a,b){ a=Math.abs(Math.floor(a)); b=Math.abs(Math.floor(b)); while (b){ const t=b; b=a%b; a=t; } return a; }
  function mcm(a,b){ a=Math.abs(Math.floor(a)); b=Math.abs(Math.floor(b)); if (!a||!b) return 0; return a*b/mcd(a,b); }
  function stats(ns){
    const n = ns.length;
    if (!n) return null;
    const sum = ns.reduce((a,b)=>a+b,0);
    const med = sum/n;
    const o = ns.slice().sort((a,b)=>a-b);
    const md = n%2 ? o[(n-1)/2] : (o[n/2-1]+o[n/2])/2;
    const cnt = {};
    o.forEach(v => cnt[v] = (cnt[v]||0)+1);
    let mod = [], mx = 0;
    for (const k in cnt){
      if (cnt[k] > mx){ mx = cnt[k]; mod = [parseFloat(k)]; }
      else if (cnt[k] === mx) mod.push(parseFloat(k));
    }
    const vz = ns.reduce((a,b)=>a+Math.pow(b-med,2),0)/n;
    return { sum, med, md, mod, vz, dev: Math.sqrt(vz), min: o[0], max: o[n-1] };
  }
  function cuad(a,b,c){
    const d = b*b - 4*a*c;
    if (d < 0){
      const re = -b/(2*a), im = Math.sqrt(-d)/(2*a);
      return { tipo:'complejas', x1: re + ' + ' + im.toFixed(4) + 'i', x2: re + ' - ' + im.toFixed(4) + 'i' };
    }
    if (d === 0) return { tipo:'doble', x1: -b/(2*a) };
    return { tipo:'reales', x1: (-b+Math.sqrt(d))/(2*a), x2: (-b-Math.sqrt(d))/(2*a) };
  }
  return { eval: eval_, primo, factores, fib, mcd, mcm, stats, cuad };
})();

/* ---------- personalización ---------- */
function pers(txt){
  const t = norm(txt);
  let m = txt.match(/(?:no\s+me\s+digas|no\s+me\s+llames|deja\s+de\s+decirme|no\s+me\s+trates\s+de|no\s+quiero\s+que\s+me\s+digas|no\s+m[aá]s)\s+([\p{L}][\p{L}\p{M}]{0,30})/iu);
  if (m){
    const bl = m[1].toLowerCase();
    if (S.apelativo && S.apelativo.toLowerCase() === bl){
      S.apelativo = ''; save();
      return 'Entendido. Dejaré de dirigirme a usted como "' + m[1] + '".';
    }
    return 'Entendido. No le llamaré "' + m[1] + '".';
  }
  if (/(no\s+me\s+digas\s+se[ñn]or|no\s+me\s+llames\s+se[ñn]or|deja\s+de\s+decirme\s+se[ñn]or|sin\s+se[ñn]or)/.test(t)){
    S.apelativo = ''; save();
    return 'Entendido, ' + S.nombre + '. No volveré a decirte "señor".';
  }
  m = txt.match(/(?:mi\s+nombre\s+es|ll[aá]mame(?:\s+como)?|puedes\s+llamarme|quiero\s+que\s+me\s+llames|tr[aá]tame\s+como|refi[eé]rete\s+a\s+m[ií]\s+como)\s+([\p{L}][\p{L}\p{M}'\-]{0,30})/iu);
  if (m){
    const n = m[1].trim().replace(/[^\p{L}\p{M}'\- ]/gu,'');
    if (n){
      S.nombre = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
      S.apelativo = S.nombre;
      save();
      return 'Entendido, ' + S.nombre + '. A partir de ahora me dirigiré a usted así.';
    }
  }
  m = txt.match(/^dime\s+([\p{L}][\p{L}\p{M}'\-]{0,30})/iu);
  if (m){
    const p = m[1].toLowerCase();
    const COMUNES = /^(algo|una|un|la|el|los|las|que|qu[eé]|como|c[oó]mo|donde|d[oó]nde|cuando|cu[aá]ndo|por|para|si|no|tu|mi|su|otra|otro|esta|este|esa|ese|mas|m[aá]s|hola|chau|adios|todo|nada)$/i;
    if (!COMUNES.test(p)){
      S.nombre = p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
      S.apelativo = S.nombre;
      save();
      return 'Entendido, ' + S.nombre + '. A partir de ahora me dirigiré a usted así.';
    }
  }
  if (/(?:vuelve\s+a\s+decirme|dime|ll[aá]mame|tr[aá]tame\s+de)\s+se[ñn]or/.test(t)){
    S.apelativo = 'Señor'; save();
    return 'Como usted diga, Señor.';
  }
  if (/(sin\s+t[ií]tulos?|no\s+uses?\s+t[ií]tulos?|no\s+me\s+pongas?\s+t[ií]tulos?|sin\s+formalidades)/.test(t)){
    S.apelativo = ''; save();
    return 'Entendido. Hablaré sin títulos.';
  }
  if (/(c[oó]mo\s+me\s+llamas|c[oó]mo\s+me\s+llamo|cu[aá]l\s+es\s+mi\s+nombre)/.test(t)){
    if (S.apelativo) return 'Me dirijo a usted como "' + S.apelativo + '".';
    return 'Actualmente no uso ningún apelativo. Decime "llámame [nombre]".';
  }
  if (/(qui[eé]n\s+soy|mi\s+identidad)/.test(t)){
    if (S.apelativo) return 'Usted es ' + S.apelativo + ', mi usuario principal.';
    return 'Usted es mi usuario principal.';
  }
  return null;
}

/* ---------- timers ---------- */
function startTimer(n, u){
  n = Number(n);
  if (!isFinite(n) || n <= 0) return 'El tiempo debe ser mayor que cero.';
  let ms = n * 1000;
  if (u.startsWith('min')) ms = n * 60000;
  if (u.startsWith('hora')) ms = n * 3600000;
  if (ms > 7*24*3600000) return 'Máximo 7 días.';
  const id = Date.now() + '-' + Math.random();
  const t = setTimeout(() => {
    S.timers.delete(id);
    addMsg('⏰ ' + S.nombre + apeF() + ', terminó el temporizador de ' + n + ' ' + u + '.', 'system');
    hablar('Atención. Terminó el temporizador.');
  }, ms);
  S.timers.set(id, t);
  return fraseJ() + ' Temporizador activado por ' + n + ' ' + u + '.';
}
function clearTimers(){
  for (const t of S.timers.values()) clearTimeout(t);
  S.timers.clear();
}
function countdown(sec){
  if (!Number.isSafeInteger(sec) || sec < 1 || sec > 86400) return 'Cuenta atrás entre 1 seg y 24 horas.';
  let r = sec;
  addMsg('Cuenta atrás: ' + sec + ' segundos.', 'system');
  const id = setInterval(() => {
    r -= 1;
    if (r <= 0){
      clearInterval(id);
      S.timers.delete(id);
      addMsg('⏰ ¡Cuenta atrás terminada!', 'system');
      hablar('La cuenta atrás terminó.');
    }
  }, 1000);
  S.timers.set(id, id);
  return fraseJ() + ' Cuenta atrás iniciada desde ' + sec + '.';
}

/* ---------- matemática ---------- */
function mat(texto){
  const t = norm(texto);
  let m;
  m = t.match(/(?:es\s+primo|numero\s+primo)\s+(?:el\s+)?(?:numero\s+)?(\d+)/);
  if (m){ const n = parseInt(m[1],10); return ME.primo(n) ? 'Sí' + apeF() + ', ' + n + ' es primo.' : 'No' + apeF() + ', ' + n + ' no es primo.'; }
  m = t.match(/(?:factores\s+primos?\s+de|factoriza)\s+(\d+)/);
  if (m){ const n = parseInt(m[1],10); const f = ME.factores(n); if (f.length) return 'Factores primos de ' + n + ': ' + f.join(' × '); }
  m = t.match(/fibonacci\s+(?:de\s+|numero\s+)?(\d+)/);
  if (m){ const n = parseInt(m[1],10); const r = ME.fib(n); if (r !== null) return 'Fibonacci ' + n + ' = ' + r; }
  m = t.match(/(?:factorial\s+de)\s+(\d+)/);
  if (m){ const n = parseInt(m[1],10); if (n > 170) return 'Número demasiado grande.'; return n + '! = ' + ME.eval(n + '!'); }
  m = t.match(/(?:mcd|maximo\s+comun\s+divisor)\s*(?:de)?\s*(\d+)\s*(?:y|,)\s*(\d+)/);
  if (m) return 'MCD(' + m[1] + ',' + m[2] + ') = ' + ME.mcd(parseInt(m[1],10),parseInt(m[2],10));
  m = t.match(/(?:mcm|minimo\s+comun\s+multiplo)\s*(?:de)?\s*(\d+)\s*(?:y|,)\s*(\d+)/);
  if (m) return 'MCM(' + m[1] + ',' + m[2] + ') = ' + ME.mcm(parseInt(m[1],10),parseInt(m[2],10));
  m = texto.match(/(-?\d*)\s*x\s*(?:\^?2)?\s*([+\-]\s*\d*)\s*x\s*([+\-]\s*\d+)?\s*=\s*0/i);
  if (m){
    const a = (m[1] === '' || m[1] === '+') ? 1 : (m[1] === '-' ? -1 : parseInt(m[1],10));
    const bS = (m[2]||'').replace(/\s+/g,'');
    const cS = (m[3]||'').replace(/\s+/g,'');
    const b = bS === '+x' ? 1 : bS === '-x' ? -1 : parseInt(bS,10);
    const c = cS ? parseInt(cS,10) : 0;
    if (isFinite(a) && isFinite(b) && isFinite(c) && a !== 0){
      const r = ME.cuad(a,b,c);
      if (r.tipo === 'reales') return a + 'x²+' + b + 'x+' + c + '=0\nx₁ = ' + fmtN(r.x1) + '\nx₂ = ' + fmtN(r.x2);
      if (r.tipo === 'doble') return 'Solución doble: x = ' + fmtN(r.x1);
      return 'Complejas: ' + r.x1 + ', ' + r.x2;
    }
  }
  m = t.match(/(media|promedio|mediana|moda|desviacion|varianza)\s+(?:de\s+)?([\d\s,.;]+)/);
  if (m){
    const ns = m[2].split(/[\s,;.]+/).map(parseFloat).filter(n => isFinite(n));
    if (ns.length >= 2){
      const e = ME.stats(ns);
      if (/media|promedio/.test(m[1])) return 'Media: ' + fmtN(e.med);
      if (/mediana/.test(m[1])) return 'Mediana: ' + fmtN(e.md);
      if (/moda/.test(m[1])) return 'Moda: ' + e.mod.join(', ');
      if (/desviacion/.test(m[1])) return 'Desv: ' + fmtN(e.dev);
      if (/varianza/.test(m[1])) return 'Var: ' + fmtN(e.vz);
    }
  }
  m = t.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:de|del)\s*(\d+(?:[.,]\d+)?)/);
  if (m) return m[1] + '% de ' + m[2] + ' = ' + fmtN(parseFloat(m[1].replace(',','.'))*parseFloat(m[2].replace(',','.'))/100);
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(celsius|°c|centigrados?)\s+a\s+(fahrenheit|°f)/);
  if (m) return m[1] + ' °C = ' + fmtN(parseFloat(m[1].replace(',','.'))*9/5+32) + ' °F';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(fahrenheit|°f)\s+a\s+(celsius|°c|centigrados?)/);
  if (m) return m[1] + ' °F = ' + fmtN((parseFloat(m[1].replace(',','.'))-32)*5/9) + ' °C';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(km|kilometros?)\s+a\s+(millas?|mi)/);
  if (m) return m[1] + ' km = ' + fmtN(parseFloat(m[1].replace(',','.'))*0.621371) + ' mi';
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilogramos?)\s+a\s*(libras?|lb)/);
  if (m) return m[1] + ' kg = ' + fmtN(parseFloat(m[1].replace(',','.'))*2.20462) + ' lb';
  if (/^(?:calcula(?:me)?|cuanto es|cuanto da|cuanto vale|resuelve|resultado de)\b/.test(t)){
    const r = ME.eval(texto);
    if (r !== null) return fraseJ() + ' Resultado: ' + fmtN(r);
    return 'No pude interpretar. Probá "calcula 24 * 7".';
  }
  if (/^[\d\s+\-*/%^().,!]+$/.test(texto.trim()) && /[+\-*/%^!]/.test(texto)){
    const r = ME.eval(texto);
    if (r !== null) return 'Resultado: ' + fmtN(r);
  }
  return null;
}

/* ---------- comandos locales ---------- */
function local(txt){
  const t = norm(txt);
  const plano = txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  if (!t) return { h: true, r: 'Escribí algo.' };

  /* 1. Personalización */
  const p = pers(txt);
  if (p) return { h: true, r: p };

  /* 2. Saludo a persona */
  const s = saludo(txt);
  if (s) return { h: true, r: s };

  /* 3. Color del reactor */
  if (/(?:cambia|cambiar|pon|poner|pinta|coloca|quiero|haz|vuelve|modifica)\s+(?:el\s+)?(?:reactor|nucleo|núcleo|color|tema|fondo|interfaz|ui)\s+(?:a|en|de|al|para)\s+(?:color\s+)?([a-záéíóúñ]+)/i.test(t)
    || /(?:reactor|nucleo|núcleo)\s+(?:en\s+|de\s+|a\s+)?(?:color\s+)?([a-záéíóúñ]+)/i.test(t)){
    let k = null;
    for (const c in COL){
      for (const a of COL[c].a){
        if (new RegExp('\\b' + a + '\\b').test(t)){ k = c; break; }
      }
      if (k) break;
    }
    if (!k){
      const m = txt.match(/(?:color|reactor|nucleo|núcleo|tema)\s+(?:a|en|de|al|para)\s+(?:color\s+)?([a-záéíóúñ]+)/i);
      if (m) k = detectarColor(m[1]);
    }
    if (k){
      aplicarColor(k);
      return { h: true, r: fraseJ() + ' Reactor en color ' + COL[k].n + '.' };
    }
    return { h: true, r: fraseJ() + ' Colores disponibles: ' + Object.keys(COL).map(x=>COL[x].n).join(', ') + '.' };
  }

  /* 4. Identidad */
  if (/\b(te llamas|tu nombre|como te llamas|quien eres|que eres|eres agus|tu identidad)\b/.test(t)){
    return { h: true, r: 'Soy AGUS, su asistente personal. Puedo abrir sitios, hacer matemática avanzada, cambiar el color del reactor, contar datos curiosos y, con IA, investigar con fuentes web.' };
  }

  /* 5. Ayuda */
  if (/\b(que puedes hacer|ayuda|comandos|opciones|funciones|capacidades)\b/.test(t)){
    return { h: true, r:
      'Capacidades' + apeF() + ':\n\n' +
      '🎨 REACTOR: "cambia el reactor a rojo"\n' +
      '🌐 ABRIR: "abre youtube", "abre youtube y busca gatitos"\n' +
      '🔍 BUSCAR: "busca recetas de pan", "pon música de Queen"\n' +
      '👤 NOMBRE: "llámame José", "no me digas señor", "saluda a María"\n' +
      '🧮 MATEMÁTICA: "15% de 240", "raíz cuadrada de 144", "factorial de 7", "es primo 97"\n' +
      '📚 CONOCIMIENTO: "dime un chiste", "dime una curiosidad", "dime algo de historia"\n' +
      '🕐 UTILIDADES: "qué hora es", "temporizador de 5 minutos", "lanza un dado"\n' +
      '🎮 JUEGOS: "piedra papel o tijera"'
    };
  }

  /* 6. Saludo */
  if (/^(?:hola|buenas|buen d[ií]a|buenos d[ií]as|buenas tardes|buenas noches|hey|qu[eé] tal|saludos)(?:\s|$)/.test(t)){
    const h = new Date().getHours();
    const g = h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
    return { h: true, r: g + apeF() + '. Soy AGUS. ¿Qué necesita?' };
  }

  /* 7. Hora y fecha */
  if (/\b(que hora es|dime la hora|hora actual|decime la hora)\b/.test(t)){
    return { h: true, r: 'Son las ' + new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()) + apeF() + '.' };
  }
  if (/\b(que fecha es|fecha de hoy|que dia es hoy|dia de hoy)\b/.test(t)){
    return { h: true, r: 'Hoy es ' + new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()) + apeF() + '.' };
  }

  /* 8. Silencio */
  if (/\b(silencio|callate|deja de hablar|modo mudo|silencio total)\b/.test(t)){
    if (S.synth) S.synth.cancel();
    body.classList.remove('speaking');
    return { h: true, r: 'Modo silencioso.', speak: false };
  }

  /* 9. Cancelar timers */
  if (/\b(detene|deten|cancela|cancelar|apaga|parar)\s+(?:el |los )?temporizador(?:es)?\b/.test(t)){
    const n = S.timers.size;
    clearTimers();
    return { h: true, r: n ? 'Cancelé ' + n + ' temporizador(es).' : 'No había temporizadores.' };
  }

  /* 10. Timers */
  let m = t.match(/(?:temporizador|alarma|aviso)\s+(?:de|por|en|para)\s+(\d+(?:[.,]\d+)?)\s*(segundos?|segs?|minutos?|mins?|horas?)/);
  if (m){
    const u = /^seg/.test(m[2]) ? 'segundos' : /^min/.test(m[2]) ? 'minutos' : 'horas';
    return { h: true, r: startTimer(Number(m[1].replace(',','.')), u) };
  }
  m = t.match(/(?:cuenta atras|cuenta regresiva)\s+(?:de\s+)?(\d+)/);
  if (m) return { h: true, r: countdown(Number(m[1])) };

  /* 11. Conocimiento */
  if (/\b(chiste|hazme reir|algo gracioso|broma|cuentame un chiste)\b/.test(t)) return { h: true, r: fraseJ() + ' ' + pick(CHISTES) };
  if (/\b(curiosidad|dato curioso|sabias que|dato interesante|algo interesante)\b/.test(t)) return { h: true, r: pick(CURIOS) };
  if (/\b(historia|dato historico|algo de historia|ciencia|dato cientifico|algo de ciencia|tecnologia|informatica|geografia|filosofia|salud|cuerpo humano)\b/.test(t)) return { h: true, r: pick(CURIOS) };
  if (/\b(piropo|cumplido|algo bonito|halago)\b/.test(t)) return { h: true, r: pick(PIROPOS) };
  if (/\b(reflexion|algo profundo|pensamiento)\b/.test(t)) return { h: true, r: pick(REFLEX) };
  if (/\b(consejo|aconsejame|dame un consejo|recomendacion)\b/.test(t)) return { h: true, r: pick(CONSEJOS) };
  if (/\b(motivame|motivacion|inspirame|dame fuerzas|algo motivador)\b/.test(t)) return { h: true, r: pick(MOTIV) };

  /* 12. Juegos */
  if (/\b(lanza una moneda|tira la moneda|cara o cruz)\b/.test(t)){
    return { h: true, r: 'Ha salido ' + (Math.random() < 0.5 ? 'cara' : 'cruz') + apeF() + '.' };
  }
  m = t.match(/(?:lanza|tira)\s+(?:un\s+)?dado(?:\s+de\s+(\d+))?/);
  if (m){ const c = Math.max(2, Math.min(100, Number(m[1] || 6))); return { h: true, r: 'Salió ' + (Math.floor(Math.random()*c)+1) + ' en el dado de ' + c + ' caras.' }; }
  m = t.match(/(?:piedra papel o tijera|juguemos piedra papel tijera)\s*(piedra|papel|tijera)?/);
  if (m){
    const u = m[1];
    const b = pick(['piedra','papel','tijera']);
    if (!u) return { h: true, r: 'Elijo ' + b + '. ¿Vos qué elegís?' };
    const r = u === b ? 'Empate' : ((u==='piedra'&&b==='tijera')||(u==='papel'&&b==='piedra')||(u==='tijera'&&b==='papel')) ? '¡Ganaste!' : 'Gano yo';
    return { h: true, r: r + apeF() + '. Vos: ' + u + ', yo: ' + b + '.' };
  }

  /* 13. Pantalla completa */
  if (/\b(pantalla completa|maximizar pantalla)\b/.test(t)){
    if (!document.fullscreenElement){
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
      return { h: true, r: 'Activando pantalla completa.' };
    }
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    return { h: true, r: 'Saliendo de pantalla completa.' };
  }

  /* 14. Matemática */
  const mm = mat(txt);
  if (mm) return { h: true, r: mm };

  /* 15. "abre X y busca Y" */
  m = plano.match(/^(?:por favor\s+)?(?:abre|abrir|abri|abreme|ve a|entra a|visita|llevame a|quiero abrir|puedes abrir|podes abrir|necesito abrir)\s+(youtube|google|wikipedia|wiki|mercadolibre|mercado libre|spotify|github|amazon|netflix|twitch|reddit|stackoverflow|instagram|facebook|tiktok|twitter|x)\s+(?:y\s+|para\s+|a\s+)?(?:busca|buscar|buscame|pon|reproduce|encuentra|quiero ver|quiero escuchar|muestra|muestrame)\s+(.+?)\s*$/i);
  if (m){
    const sitio = m[1].toLowerCase();
    const q = m[3].trim();
    let url, label;
    if (/youtube/.test(sitio)){ url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q); label = 'YouTube: ' + q; }
    else if (/google/.test(sitio)){ url = 'https://www.google.com/search?q=' + encodeURIComponent(q); label = 'Google: ' + q; }
    else if (/wikipedia|wiki/.test(sitio)){ url = 'https://es.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(q); label = 'Wikipedia: ' + q; }
    else if (/mercadolibre|mercado/.test(sitio)){ url = 'https://listado.mercadolibre.com.ar/' + encodeURIComponent(q); label = 'Mercado Libre: ' + q; }
    else if (/spotify/.test(sitio)){ url = 'https://open.spotify.com/search/' + encodeURIComponent(q); label = 'Spotify: ' + q; }
    else if (/github/.test(sitio)){ url = 'https://github.com/search?q=' + encodeURIComponent(q); label = 'GitHub: ' + q; }
    else if (/amazon/.test(sitio)){ url = 'https://www.amazon.com/s?k=' + encodeURIComponent(q); label = 'Amazon: ' + q; }
    else if (/netflix/.test(sitio)){ url = 'https://www.netflix.com/search?q=' + encodeURIComponent(q); label = 'Netflix: ' + q; }
    else if (/twitch/.test(sitio)){ url = 'https://www.twitch.tv/search?term=' + encodeURIComponent(q); label = 'Twitch: ' + q; }
    else if (/reddit/.test(sitio)){ url = 'https://www.reddit.com/search/?q=' + encodeURIComponent(q); label = 'Reddit: ' + q; }
    else if (/stackoverflow/.test(sitio)){ url = 'https://es.stackoverflow.com/search?q=' + encodeURIComponent(q); label = 'Stack Overflow: ' + q; }
    else if (/instagram/.test(sitio)){ url = 'https://www.instagram.com/explore/tags/' + encodeURIComponent(q.replace(/\s+/g,'')); label = 'Instagram: ' + q; }
    else if (/facebook/.test(sitio)){ url = 'https://www.facebook.com/search/top?q=' + encodeURIComponent(q); label = 'Facebook: ' + q; }
    else if (/tiktok/.test(sitio)){ url = 'https://www.tiktok.com/search?q=' + encodeURIComponent(q); label = 'TikTok: ' + q; }
    else if (/twitter|x/.test(sitio)){ url = 'https://x.com/search?q=' + encodeURIComponent(q); label = 'X: ' + q; }
    else { url = 'https://www.google.com/search?q=' + encodeURIComponent(sitio + ' ' + q); label = sitio + ': ' + q; }
    abrir(url, label);
    return { h: true, r: fraseJ() + ' Abro ' + label + '.', speak: false };
  }

  /* 16. Apertura simple */
  m = plano.match(/^(?:por favor\s+)?(?:abre|abrir|abri|abreme|ve a|entra a|visita|llevame a|quiero abrir|puedes abrir|podes abrir|necesito abrir|pon|ponme)\s+(.+?)\s*$/i);
  if (m){
    const d = m[1].replace(/\s+(?:por favor|ahora|rapido|ya)$/i,'').trim();
    const s = detectarSitio(d);
    if (s){
      abrir(s.u || s.url, s.l || s.label);
      return { h: true, r: fraseJ() + ' Abro ' + (s.l || s.label) + '.', speak: false };
    }
    if (buscar(d, 'google')){
      return { h: true, r: 'No tengo ese sitio. Busco "' + d + '" en Google' + apeF() + '.', speak: false };
    }
  }

  /* 17. YouTube */
  m = plano.match(/^(?:busca|buscar|buscame|pon|reproduce|encuentra|quiero ver|quiero escuchar|poneme)\s+(?:en\s+)?youtube\s+(.+)$/i);
  if (m && m[1].trim()){
    buscar(m[1].trim(), 'youtube');
    return { h: true, r: 'Abro YouTube con: "' + m[1].trim() + '"', speak: false };
  }
  m = plano.match(/^(?:pon|reproduce|quiero escuchar|quiero oir|poneme)\s+(?:la\s+)?(?:cancion|musica|tema)\s+(?:de\s+)?(.+)$/i);
  if (m && m[1].trim()){
    const q = 'música ' + m[1].trim();
    buscar(q, 'youtube');
    return { h: true, r: 'Abro YouTube para: "' + q + '"', speak: false };
  }

  /* 18. Google */
  m = plano.match(/^(?:busca|buscar|buscame|googlea|encuentra)\s+(?:en google\s+|en internet\s+|en la web\s+)?(.+)$/i);
  if (m && m[1].trim()){
    buscar(m[1].trim(), 'google');
    return { h: true, r: 'Busco en Google: "' + m[1].trim() + '"', speak: false };
  }
  if (/^(?:pon|reproduce|quiero escuchar)\s+(?:musica|una cancion)\b/.test(t)){
    buscar('lofi hip hop radio', 'youtube');
    return { h: true, r: 'Música relajante.', speak: false };
  }

  return null;
}

/* ---------- IA ---------- */
async function health(){
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    if (!r.ok) throw 0;
    const d = await r.json();
    S.aiOk = Boolean(d.aiConfigured);
    S.model = d.model || '';
    setEstado('Listo para ayudarte', S.aiOk);
    if (S.aiOk) statusEl.textContent = 'IA · ' + S.model;
  } catch (_){
    S.aiOk = false;
    setEstado('Modo local', false);
  }
}

async function pregIA(txt){
  if (!S.aiOk) return null;
  const h = S.conv.slice(-S.maxHist).map(i => ({ role: i.role, content: i.content }));
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: txt, history: h })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
    if (!d.reply) throw new Error('Vacío');
    return { reply: d.reply, sources: Array.isArray(d.sources) ? d.sources : [] };
  } catch (e){
    return { reply: 'No pude conectar con la IA (' + String(e.message).slice(0,150) + ').', sources: [] };
  }
}

/* ---------- manejar usuario ---------- */
async function handle(txt){
  const t = String(txt||'').trim();
  if (!t) return;
  addMsg(t, 'user');

  const l = local(t);
  if (l && l.h){
    reply(l.r, { speak: l.speak });
    return;
  }

  S.conv.push({ role: 'user', content: t });
  showTyping();
  const res = await pregIA(t);
  hideTyping();

  if (res){
    S.conv.push({ role: 'assistant', content: res.reply });
    while (S.conv.length > S.maxHist) S.conv.shift();
    reply(res.reply, { fuentes: res.sources });
    return;
  }
  reply('Estoy en modo local. Podés decir "abre YouTube", "calcula 24*7" o conectar la IA con tu clave en .env.');
}

let reco = null, oyendo = false;
if (SR){
  reco = new SR();
  reco.lang = 'es-AR';
  reco.continuous = false;
  reco.interimResults = false;
  reco.maxAlternatives = 1;
  reco.onstart = () => { oyendo = true; micBtn.classList.add('on'); body.classList.add('listening'); };
  reco.onresult = e => {
    const r = e.results && e.results[e.results.length-1] && e.results[e.results.length-1][0] && e.results[e.results.length-1][0].transcript;
    if (r) handle(r);
  };
  reco.onerror = e => {
    const msg = e.error === 'not-allowed' ? 'El navegador bloqueó el micrófono.' : e.error === 'no-speech' ? 'No detecté voz.' : 'Error: ' + e.error;
    addMsg(msg, 'system');
  };
  reco.onend = () => { oyendo = false; micBtn.classList.remove('on'); body.classList.remove('listening'); };
}
micBtn.addEventListener('click', () => {
  if (!reco){ addMsg('Tu navegador no soporta dictado. Probá Chrome o Edge.', 'system'); return; }
  if (oyendo){ try { reco.stop(); } catch(_){} return; }
  try { if (S.synth) S.synth.cancel(); reco.start(); }
  catch(_){ addMsg('No pude iniciar el micrófono.', 'system'); }
});

/* ---------- arranque ---------- */
window.addEventListener('load', async () => {
  aplicarColor(S.color);
  await health();
  setTimeout(() => $('#boot').classList.add('hide'), 400);
  addMsg('Buenas' + apeF() + '. Soy AGUS, su asistente. A su entera disposición. Dígame qué necesita.', 'bot');
  setTimeout(() => hablar('Buenas' + apeF() + '. Soy AGUS. A su entera disposición. Dígame qué necesita.'), 700);
});
